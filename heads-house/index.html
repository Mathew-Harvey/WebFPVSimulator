<!doctype html>
<!--
  heads-house/index.html: Heads' house and yard, from the Infinity Loops FPV
  footage, drawn as one procedural Three.js page.

  Sources: twelve stills the owner cut from Heads' videos on 2026-10-20 (the
  corner, the driveway, the front lawn and door, the garage side, the patio
  and back yard, the garage, the basement) and the public YouTube stills of
  BvXv_x23Da8, UvvTN3lLreI and 8G5ooyFyxs8. Placement went through the
  media2threejs image-scene route; the records are in .loop/heads-house/.

  What is seen and what is inferred: the outside, the garage and the
  basement family room are drawn from the stills. The main floor and the
  upstairs are inferred from a side split of this kind (the owner's words:
  "you can infer the upstairs"). People are left out. The street name sign
  is blank on purpose.

  World: metres, Y up, X east, Z south, origin at the middle of the
  intersection. Three.js draws it directly; nothing here touches the
  simulator's physics frame.

  Query parameters: ?view=<name> opens a named view (the buttons list them),
  ?autumn=1, ?roof=0, ?upstairs=0, ?garage=open.
  window.__heads is the hook the capture script reads.

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heads' house</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #d6e3ef; font: 13px/1.35 system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #panel {
        position: fixed; left: 12px; top: 12px; width: 300px; max-width: calc(100vw - 24px);
        max-height: calc(100vh - 24px); overflow: auto; box-sizing: border-box;
        background: rgba(22, 26, 34, 0.82); color: #eef1f5; border-radius: 10px; padding: 12px 14px;
        backdrop-filter: blur(6px);
      }
      #panel.closed > :not(header) { display: none; }
      header { display: flex; align-items: baseline; gap: 8px; }
      h1 { font-size: 17px; margin: 0; flex: 1; }
      #fold { background: none; border: 0; color: #eef1f5; font-size: 16px; cursor: pointer; padding: 0 4px; }
      .sub { margin: 2px 0 10px; color: #b8c2cf; }
      h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #9fb0c4; margin: 10px 0 6px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
      button.v, button.t {
        background: #343c4b; color: #eef1f5; border: 1px solid #485267; border-radius: 6px;
        padding: 5px 6px; text-align: left; cursor: pointer; font: inherit; font-size: 12px;
      }
      button.v:hover, button.t:hover { background: #414b5e; }
      button.v.on, button.t.on { background: #c8432f; border-color: #e0634d; }
      .ref { color: #9fb0c4; font-size: 11px; }
      .toggles { display: flex; flex-wrap: wrap; gap: 5px; }
      .help { color: #b8c2cf; font-size: 12px; margin-top: 10px; }
      #label {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100vw - 32px);
        background: rgba(22, 26, 34, 0.78); color: #eef1f5; padding: 6px 12px; border-radius: 8px; font-size: 13px;
        text-align: center; pointer-events: none;
      }
      @media (max-width: 640px) { #panel { width: auto; right: 12px; } #label { font-size: 12px; } }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <header><h1>Heads' house</h1><button id="fold" title="Fold the panel">&#9776;</button></header>
      <p class="sub">The Infinity Loops house and yard, rebuilt from the FPV footage.</p>
      <h2>Views from the footage</h2>
      <div class="grid" id="views"></div>
      <h2>Show</h2>
      <div class="toggles">
        <button class="t on" id="tRoof">Roof</button>
        <button class="t on" id="tUpper">Upstairs</button>
        <button class="t" id="tGarage">Garage door open</button>
        <button class="t" id="tAutumn">Autumn</button>
        <button class="t" id="tFly">Fly (F)</button>
      </div>
      <p class="help">Drag to orbit, right drag to pan, wheel to zoom. Fly: WASD to move, E and Q up and down, drag to look, Shift for speed, Esc to stop.</p>
    </div>
    <div id="label"></div>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

      /* ------------------------------------------------------------------
       * The numbers. Everything below is placed from these.
       * ------------------------------------------------------------------ */

      const KERB = 0.15;          // top of kerb, verge and lawn edge
      const G = 0.5;              // yard grade round the house
      const FL = -0.45;           // basement family room floor
      const FG = 0.2;             // garage slab
      const FM = 1.0;             // main floor
      const FU = 2.45;            // upstairs floor
      const CEIL_LOW = 2.2;       // underside of the upstairs floor
      const CEIL_MAIN = 3.45;
      const CEIL_UP = 4.85;
      const EAVE_MAIN = 3.6;
      const EAVE_UP = 5.0;
      const PITCH = 5 / 12;

      // The house: a one storey wing (west) and a two storey part over the
      // garage and the basement (east). Fronts face +z, the street.
      const MW = { x0: 15.0, x1: 23.5, z0: -25.3, z1: -16.8 };
      const TS = { x0: 23.5, x1: 33.0, z0: -25.3, z1: -16.8, up1: -16.55 };
      const LOT = { x0: 7.25, x1: 36.5, z0: -41.05, z1: -7.8 };
      const DRIVE = { x0: 28.2, x1: 34.0, z0: -16.8, z1: -7.8, y: 0.18 };
      const CC = { x: 10.5, z: -11.0 };   // centre of our corner's kerb return

      function rng(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const smooth = (t) => { const u = Math.min(1, Math.max(0, t)); return u * u * (3 - 2 * u); };

      /* ------------------------------------------------------------------
       * Renderer, scene, camera, light.
       * ------------------------------------------------------------------ */

      const canvas = document.getElementById('view');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.shadowMap.autoUpdate = false;

      const scene = new THREE.Scene();
      const FOG = new THREE.Color('#d8e4ee');
      scene.fog = new THREE.Fog(FOG, 90, 430);
      const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 6000);

      const hemi = new THREE.HemisphereLight('#d4e6ff', '#6d6a4e', 1.15);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight('#fff3df', 3.0);
      sun.position.set(22 - 24, 46, -21 - 36);
      sun.target.position.set(22, 0, -21);
      sun.castShadow = true;
      sun.shadow.mapSize.set(4096, 4096);
      Object.assign(sun.shadow.camera, { left: -46, right: 46, top: 46, bottom: -46, near: 1, far: 160 });
      sun.shadow.bias = -0.0004;
      sun.shadow.normalBias = 0.03;
      scene.add(sun, sun.target);

      /* ------------------------------------------------------------------
       * Textures, all painted here so the page is one file.
       * ------------------------------------------------------------------ */

      function canvasTex(w, h, draw, repeat = true) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        draw(c.getContext('2d'), w, h);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.anisotropy = 8;
        return t;
      }
      const grey = (v) => `rgb(${v | 0},${v | 0},${v | 0})`;
      const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;
      function speckle(g, w, h, seed, n, lo, hi, s0, s1) {
        const r = rng(seed);
        for (let i = 0; i < n; i++) {
          g.fillStyle = grey(lo + r() * (hi - lo));
          const s = s0 + r() * (s1 - s0);
          g.fillRect(r() * w, r() * h, s, s);
        }
      }

      const T = {};
      T.grass = canvasTex(256, 256, (g, w, h) => {
        const r = rng(11);
        g.fillStyle = grey(196); g.fillRect(0, 0, w, h);
        for (let i = 0; i < 7000; i++) { g.fillStyle = grey(140 + r() * 115); g.fillRect(r() * w, r() * h, 1 + r() * 1.5, 2 + r() * 4); }
      });
      T.asphalt = canvasTex(256, 256, (g, w, h) => { g.fillStyle = grey(178); g.fillRect(0, 0, w, h); speckle(g, w, h, 12, 9000, 115, 235, 1, 2.6); });
      T.concrete = canvasTex(256, 256, (g, w, h) => { g.fillStyle = grey(222); g.fillRect(0, 0, w, h); speckle(g, w, h, 13, 3000, 196, 246, 1, 2.2); });
      T.siding = canvasTex(64, 256, (g, w, h) => {
        const laps = 10, lh = h / laps;
        for (let i = 0; i < laps; i++) {
          const y = i * lh;
          const gr = g.createLinearGradient(0, y, 0, y + lh);
          gr.addColorStop(0, grey(242)); gr.addColorStop(0.8, grey(226)); gr.addColorStop(1, grey(178));
          g.fillStyle = gr; g.fillRect(0, y, w, lh);
          g.fillStyle = grey(132); g.fillRect(0, y + lh - 2, w, 2);
        }
      });
      T.shingle = canvasTex(256, 256, (g, w, h) => {
        const r = rng(14), rows = 8, rh = h / rows, tw = w / 4;
        g.fillStyle = grey(90); g.fillRect(0, 0, w, h);
        for (let i = 0; i < rows; i++) {
          for (let j = -1; j < 5; j++) {
            const x = j * tw + (i % 2) * tw / 2;
            g.fillStyle = grey(150 + r() * 80); g.fillRect(x + 1, i * rh, tw - 3, rh - 3);
          }
        }
        speckle(g, w, h, 15, 5000, 70, 230, 1, 2);
      });
      T.brick = canvasTex(256, 256, (g, w, h) => {
        const r = rng(16), rows = 16, bh = h / rows, bw = w / 5;
        g.fillStyle = '#d6cfc4'; g.fillRect(0, 0, w, h);
        for (let i = 0; i < rows; i++) {
          for (let j = -1; j < 6; j++) {
            const x = j * bw + (i % 2) * bw / 2;
            g.fillStyle = rgb(150 + r() * 50, 62 + r() * 30, 48 + r() * 24);
            g.fillRect(x + 1.5, i * bh + 1.5, bw - 3, bh - 3);
          }
        }
      });
      T.patio = canvasTex(256, 256, (g, w, h) => {
        const r = rng(17);
        g.fillStyle = '#7c4c3e'; g.fillRect(0, 0, w, h);
        for (let y = 0; y < h;) {
          const rh = [32, 48, 64][(r() * 3) | 0];
          const off = r() * 48;
          for (let x = -off; x < w;) {
            const rw = [32, 48, 64, 80][(r() * 4) | 0];
            g.fillStyle = rgb(190 + r() * 30, 116 + r() * 26, 94 + r() * 22);
            g.fillRect(x + 2, y + 2, rw - 4, Math.min(rh, h - y) - 4);
            x += rw;
          }
          y += rh;
        }
        speckle(g, w, h, 18, 2500, 90, 200, 1, 2);
      });
      T.checker = canvasTex(128, 128, (g) => {
        for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? '#1b1c1f' : '#e8e8e4'; g.fillRect(i * 64, j * 64, 64, 64); }
        g.fillStyle = 'rgba(80,80,80,0.6)'; g.fillRect(0, 0, 128, 1); g.fillRect(0, 64, 128, 1); g.fillRect(0, 0, 1, 128); g.fillRect(64, 0, 1, 128);
      });
      function planks(seed, base) {
        return canvasTex(256, 256, (g, w, h) => {
          const r = rng(seed), rows = 8, rh = h / rows;
          g.fillStyle = '#2a1d14'; g.fillRect(0, 0, w, h);
          for (let i = 0; i < rows; i++) {
            for (let x = -r() * 128; x < w;) {
              const len = 90 + r() * 110, k = 0.82 + r() * 0.3;
              g.fillStyle = rgb(base[0] * k, base[1] * k, base[2] * k);
              g.fillRect(x, i * rh, len - 2, rh - 2);
              g.fillStyle = 'rgba(40,20,10,0.12)';
              for (let s = 0; s < 4; s++) g.fillRect(x, i * rh + 3 + r() * (rh - 8), len - 2, 1);
              x += len;
            }
          }
        });
      }
      T.laminate = planks(19, [156, 98, 60]);
      T.oak = planks(20, [196, 150, 104]);
      T.tile = canvasTex(128, 128, (g) => {
        g.fillStyle = grey(150); g.fillRect(0, 0, 128, 128);
        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { g.fillStyle = grey(232 + ((i * 7 + j * 3) % 5) * 4); g.fillRect(i * 32 + 1, j * 32 + 1, 30, 30); }
      });
      T.carpet = canvasTex(128, 128, (g, w, h) => { g.fillStyle = grey(210); g.fillRect(0, 0, w, h); speckle(g, w, h, 21, 4000, 170, 245, 1, 1.6); });
      T.cmu = canvasTex(256, 256, (g, w, h) => {
        g.fillStyle = grey(200); g.fillRect(0, 0, w, h);
        const bw = 64, bh = 32;
        for (let i = 0; i < 8; i++) for (let j = -1; j < 5; j++) { g.fillStyle = grey(232); g.fillRect(j * bw + (i % 2) * bw / 2 + 2, i * bh + 2, bw - 4, bh - 4); }
        speckle(g, w, h, 22, 3000, 205, 245, 1, 2);
      });
      T.pegboard = canvasTex(128, 128, (g) => {
        g.fillStyle = '#b48d62'; g.fillRect(0, 0, 128, 128);
        g.fillStyle = '#4a3420';
        for (let i = 0; i < 16; i++) for (let j = 0; j < 16; j++) g.fillRect(i * 8 + 3, j * 8 + 3, 2, 2);
      });
      T.stickers = canvasTex(1024, 512, (g, w, h) => {
        const r = rng(23);
        g.fillStyle = '#2b2d33'; g.fillRect(0, 0, w, h);
        const cols = ['#e63b2e', '#f2c230', '#2fa4e7', '#38c172', '#9b59d0', '#ff7a1a', '#f5f5f5', '#ff4fa3', '#1d1d1d', '#21c7c7'];
        const words = ['FPV', 'SEND IT', '90%', 'LOOPS', 'WHOOP', 'RIP', 'AIR', 'TINY', 'GO FLY', 'BIND', 'ARM', 'PROPS ON', 'DVR', 'FREESTYLE'];
        for (let i = 0; i < 340; i++) {
          g.save();
          g.translate(r() * w, r() * h);
          g.rotate((r() - 0.5) * 1.2);
          const s = 18 + r() * 46, c = cols[(r() * cols.length) | 0], kind = r();
          g.fillStyle = '#ffffff';
          if (kind < 0.35) {
            g.beginPath(); g.arc(0, 0, s * 0.62, 0, Math.PI * 2); g.fill();
            g.fillStyle = c; g.beginPath(); g.arc(0, 0, s * 0.54, 0, Math.PI * 2); g.fill();
          } else {
            g.fillRect(-s * 0.8, -s * 0.42, s * 1.6, s * 0.84);
            g.fillStyle = c; g.fillRect(-s * 0.74, -s * 0.36, s * 1.48, s * 0.72);
          }
          if (r() < 0.6) {
            g.fillStyle = c === '#f5f5f5' || c === '#f2c230' ? '#1d1d1d' : '#ffffff';
            g.font = `bold ${(s * 0.32) | 0}px system-ui, sans-serif`;
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText(words[(r() * words.length) | 0], 0, 0, s * 1.4);
          }
          g.restore();
        }
      }, false);
      T.banner = canvasTex(1024, 384, (g, w, h) => {
        g.fillStyle = '#141a2e'; g.fillRect(0, 0, w, h);
        g.save(); g.translate(w * 0.78, 0); g.rotate(0.35);
        for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? '#f1f1f1' : '#c8232c'; g.fillRect(i * 46, -60, 46, h * 1.6); }
        g.restore();
        g.fillStyle = '#141a2e'; g.fillRect(0, 0, w * 0.76, h);
        g.font = 'italic bold 128px Georgia, "Times New Roman", serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineWidth = 14; g.strokeStyle = '#f4f4f4';
        g.strokeText('Infinity', w * 0.37, h * 0.33); g.strokeText('Loops', w * 0.42, h * 0.7);
        g.fillStyle = '#d42a33';
        g.fillText('Infinity', w * 0.37, h * 0.33); g.fillText('Loops', w * 0.42, h * 0.7);
      }, false);
      T.posters = canvasTex(512, 512, (g) => {
        const p = [['#1f6fd1', 'FREESTYLE', '#ffd23f'], ['#e2442f', 'RACE DAY', '#ffffff'], ['#2a2a2a', 'WHOOP CLASS', '#38c172'], ['#7b3fbf', 'SEND IT', '#ffffff']];
        p.forEach(([bg, text, fg], i) => {
          const x = (i % 2) * 256, y = ((i / 2) | 0) * 256;
          g.fillStyle = bg; g.fillRect(x, y, 256, 256);
          g.fillStyle = fg; g.beginPath(); g.arc(x + 128, y + 110, 62, 0, Math.PI * 2); g.fill();
          g.fillStyle = bg; g.beginPath(); g.arc(x + 128, y + 110, 40, 0, Math.PI * 2); g.fill();
          g.fillStyle = fg; g.font = 'bold 30px system-ui, sans-serif'; g.textAlign = 'center'; g.fillText(text, x + 128, y + 220);
        });
      }, false);
      T.tv = canvasTex(256, 144, (g, w, h) => {
        const gr = g.createLinearGradient(0, 0, w, h);
        gr.addColorStop(0, '#20262e'); gr.addColorStop(0.5, '#0c0e12'); gr.addColorStop(1, '#161a20');
        g.fillStyle = gr; g.fillRect(0, 0, w, h);
      }, false);
      T.wideTurns = canvasTex(512, 160, (g, w, h) => {
        g.fillStyle = '#f2c214'; g.fillRect(0, 0, w, h);
        g.lineWidth = 10; g.strokeStyle = '#141414'; g.strokeRect(10, 10, w - 20, h - 20);
        g.fillStyle = '#141414'; g.font = 'bold 74px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('WIDE TURNS', w / 2, h / 2 + 4);
      }, false);
      T.garageDoor = canvasTex(512, 384, (g, w, h) => {
        g.fillStyle = grey(236); g.fillRect(0, 0, w, h);
        const rows = 4, ph = h / rows;
        for (let i = 0; i < rows; i++) {
          g.fillStyle = grey(150); g.fillRect(0, i * ph, w, 2);
          for (let j = 0; j < 4; j++) {
            const x = j * w / 4 + 10, y = i * ph + 12, pw = w / 4 - 20, hh = ph - 24;
            if (i === 0) { g.fillStyle = '#4a5866'; g.fillRect(x + 6, y + 8, pw - 12, hh - 16); continue; }
            g.fillStyle = grey(222); g.fillRect(x, y, pw, hh);
            g.fillStyle = grey(250); g.fillRect(x, y, pw, 3); g.fillRect(x, y, 3, hh);
            g.fillStyle = grey(190); g.fillRect(x, y + hh - 3, pw, 3); g.fillRect(x + pw - 3, y, 3, hh);
          }
        }
      }, false);
      T.bifold = canvasTex(256, 256, (g, w, h) => {
        g.fillStyle = grey(240); g.fillRect(0, 0, w, h);
        for (let i = 0; i < 4; i++) {
          g.fillStyle = grey(196); g.fillRect(i * 64, 0, 2, h);
          for (let y = 12; y < h - 12; y += 8) { g.fillStyle = grey(214); g.fillRect(i * 64 + 10, y, 44, 3); }
        }
      }, false);
      T.stop = canvasTex(256, 256, (g, w, h) => {
        const oct = (r) => { g.beginPath(); for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + i * Math.PI / 4; g.lineTo(w / 2 + r * Math.cos(a), h / 2 + r * Math.sin(a)); } g.closePath(); };
        g.fillStyle = '#ffffff'; oct(128); g.fill();
        g.fillStyle = '#c3141d'; oct(118); g.fill();
        g.fillStyle = '#ffffff'; g.font = 'bold 74px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('STOP', w / 2, h / 2 + 3);
      }, false);
      T.grate = canvasTex(128, 128, (g) => {
        g.fillStyle = '#3b2620'; g.fillRect(0, 0, 128, 128);
        g.fillStyle = '#0d0a09';
        for (let i = 0; i < 8; i++) for (let j = 0; j < 3; j++) g.fillRect(8 + j * 40, 6 + i * 15, 32, 9);
      });
      T.ac = canvasTex(128, 128, (g) => {
        g.fillStyle = grey(150); g.fillRect(0, 0, 128, 128);
        g.fillStyle = grey(80); for (let x = 2; x < 128; x += 5) g.fillRect(x, 0, 2, 128);
      }, false);
      T.gift = canvasTex(128, 128, (g) => {
        g.fillStyle = '#c4202b'; g.fillRect(0, 0, 128, 128);
        g.strokeStyle = '#ffffff'; g.lineWidth = 2;
        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
          const x = i * 32 + 16 + (j % 2) * 8, y = j * 32 + 16;
          for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; g.beginPath(); g.moveTo(x - 7 * Math.cos(a), y - 7 * Math.sin(a)); g.lineTo(x + 7 * Math.cos(a), y + 7 * Math.sin(a)); g.stroke(); }
        }

      /* ------------------------------------------------------------------
       * The neighbourhood, so every view ends in houses and trees.
       * ------------------------------------------------------------------ */

      const SIDINGS = ['#ecebe6', '#e4dac0', '#d6c6a4', '#e8dca6', '#c8cdd0', '#a9b59b', '#b4c3cf', '#dcd3c7'];
      const ROOFS = ['#55585d', '#5e544c', '#45484d', '#615d58'];
      const SHUTTERS = ['#2f4a35', '#3c2b25', '#22324d', '#4a4d52', null, null];
      const DOORS = ['#7d1f22', '#22324d', '#f2f1ec', '#2f4a35', '#3c2b25'];
      const CARS = ['carBlack', 'carSilver', 'carWhite', 'carRed', 'carNavy', 'carGreyBlue'];

      function nWin(L, x, y, z, w, h, sh) {
        quad(L, 'glassDark', x, y + h / 2, z + 0.015, w, h, 'z+');
        box(L, 'trim', x - w / 2 - 0.08, y - 0.06, z, x + w / 2 + 0.08, y, z + 0.06);
        box(L, 'trim', x - w / 2 - 0.08, y + h, z, x + w / 2 + 0.08, y + h + 0.1, z + 0.03);
        box(L, 'trim', x - w / 2 - 0.08, y, z, x - w / 2, y + h, z + 0.03);
        box(L, 'trim', x + w / 2, y, z, x + w / 2 + 0.08, y + h, z + 0.03);
        box(L, 'trim', x - w / 2, y + h / 2 - 0.025, z, x + w / 2, y + h / 2 + 0.025, z + 0.03);
        if (sh) {
          box(L, sh, x - w / 2 - 0.5, y, z, x - w / 2 - 0.1, y + h, z + 0.03);
          box(L, sh, x + w / 2 + 0.1, y, z, x + w / 2 + 0.5, y + h, z + 0.03);
        }
      }
      function nDoor(L, x, z, col) {
        quad(L, col, x, 0.45 + 1.05, z + 0.015, 0.95, 2.1, 'z+');
        box(L, 'trim', x - 0.58, 0.45, z, x - 0.48, 2.65, z + 0.04);
        box(L, 'trim', x + 0.48, 0.45, z, x + 0.58, 2.65, z + 0.04);
        box(L, 'trim', x - 0.58, 2.55, z, x + 0.58, 2.7, z + 0.05);
        box(L, 'concrete', x - 0.9, 0, z, x + 0.9, 0.42, z + 1.2);
      }
      function sideWins(L, x0, x1, zf, zb, ys, sid) {
        for (const [x, ry] of [[x1, Math.PI / 2], [x0, -Math.PI / 2]]) {
          within(x, 0, (zf + zb) / 2, ry, () => { for (const y of ys) nWin(L, 0, y, 0, 0.9, 1.25, null); });
        }
      }

      function neighbour(ox, oz, ry, seed, spec = {}) {
        const L = 'site', r = rng(seed);
        const style = spec.style || ['colonial', 'colonial', 'split', 'rancher'][(r() * 4) | 0];
        const sidC = spec.siding || SIDINGS[(r() * SIDINGS.length) | 0];
        const sid = tinted('siding', sidC), roof = tinted('roof', spec.roof || ROOFS[(r() * ROOFS.length) | 0]);
        const sh = spec.shutters === undefined ? SHUTTERS[(r() * SHUTTERS.length) | 0] : spec.shutters;
        const shm = sh ? tinted('shutter', sh) : null;
        const door = tinted('door', DOORS[(r() * DOORS.length) | 0]);
        const set = spec.set || 9 + r() * 3;
        const side = spec.garageSide || (r() < 0.5 ? -1 : 1);
        within(ox, KERB, oz, ry, () => {
          let gx = null;
          const zf = -set;
          if (style === 'colonial') {
            const w = 10.5, d = 8.5, Hh = 5.6, zb = zf - d;
            box(L, 'foundation', -w / 2 - 0.03, -0.1, zb - 0.03, w / 2 + 0.03, 0.45, zf + 0.03);
            box(L, sid, -w / 2, 0.45, zb, w / 2, Hh, zf);
            if (spec.brick) box(L, 'brick', -w / 2 - 0.02, 0.45, zf - 0.01, w / 2 + 0.02, 2.9, zf + 0.035);
            const yR = gableRoof(L, -w / 2, w / 2, zf, zb, Hh, 8 / 12, 0.35, { west: true, east: true }, sid, roof);
            nDoor(L, 0, zf, door);
            for (const x of [-3.6, -2.0, 2.0, 3.6]) nWin(L, x, 1.35, zf, 0.95, 1.35, shm);
            for (const x of [-3.6, -1.8, 0, 1.8, 3.6]) nWin(L, x, 3.6, zf, 0.95, 1.3, shm);
            sideWins(L, -w / 2, w / 2, zf, zb, [1.35, 3.6], sid);
            if (spec.chimney || r() < 0.4) { const cx = (spec.chimney || 1) * (w / 2 + 0.35); box(L, 'brick', cx - 0.4, 0, (zf + zb) / 2 - 0.55, cx + 0.4, yR + 0.9, (zf + zb) / 2 + 0.55); }
            if (spec.garage !== false && r() < 0.6) {
              const gx0 = side > 0 ? w / 2 : -w / 2 - 6.6, gx1 = gx0 + 6.6;
              box(L, sid, gx0, 0, zf - 7.2, gx1, 3.0, zf - 0.6);
              gableRoof(L, gx0, gx1, zf - 0.6, zf - 7.2, 3.0, 6 / 12, 0.3, { west: side < 0, east: side > 0 }, sid, roof);
              gx = (gx0 + gx1) / 2;
              quad(L, spec.openGarage ? 'metalBlack' : 'garageDoor', gx, 1.1, zf - 0.585, 4.9, 2.1, 'z+');
            } else gx = side * (w / 2 + 2.2);
          } else if (style === 'split') {
            const d = 8.5, zb = zf - d, s = side;
            const a0 = s > 0 ? -7.5 : -0.5, a1 = a0 + 8.0, b0 = s > 0 ? 0.5 : -7.5, b1 = b0 + 7.0;
            box(L, sid, a0, 0, zb, a1, 3.3, zf);
            box(L, sid, b0, 0, zb, b1, 5.2, zf + 0.25);
            if (spec.brick) box(L, 'brick', b0 - 0.02, 0, zf + 0.24, b1 + 0.02, 2.3, zf + 0.29);
            gableRoof(L, a0, a1, zf, zb, 3.3, 5 / 12, 0.35, { west: s > 0, east: s < 0 }, sid, roof);
            gableRoof(L, b0, b1, zf + 0.25, zb, 5.2, 5 / 12, 0.35, { west: true, east: true }, sid, roof);
            const dx = s > 0 ? a1 - 1.2 : a0 + 1.2;
            nDoor(L, dx, zf, door);
            nWin(L, (a0 + a1) / 2 - s * 0.8, 1.6, zf, 2.2, 1.3, shm);
            gx = (b0 + b1) / 2 + s * 0.6;
            quad(L, 'garageDoor', gx, 1.05, zf + 0.265, 2.9, 2.0, 'z+');
            nWin(L, gx - s * 2.4, 0.9, zf + 0.25, 1.0, 1.0, null);
            for (const x of [b0 + 1.6, b1 - 1.6]) nWin(L, x, 3.25, zf + 0.25, 1.1, 1.25, null);
          } else {
            const w = 15, d = 9, zb = zf - d;
            box(L, 'foundation', -w / 2 - 0.03, -0.1, zb - 0.03, w / 2 + 0.03, 0.45, zf + 0.03);
            box(L, sid, -w / 2, 0.45, zb, w / 2, 3.1, zf);
            if (spec.brick) box(L, 'brick', -w / 2 - 0.02, 0.45, zf - 0.01, w / 2 + 0.02, 1.4, zf + 0.035);
            gableRoof(L, -w / 2, w / 2, zf, zb, 3.1, 5 / 12, 0.4, { west: true, east: true }, sid, roof);
            gx = side * (w / 2 - 2.0);
            quad(L, 'garageDoor', gx, 1.15, zf + 0.015, 2.9, 2.0, 'z+');
            nDoor(L, -side * 1.0, zf, door);
            for (const x of [-side * 3.4, -side * 5.6, side * 1.6]) nWin(L, x, 1.35, zf, 1.0, 1.3, shm);
            sideWins(L, -w / 2, w / 2, zf, zb, [1.35], sid);
          }

      addEventListener('resize', resize);
      resize();

      const q = new URLSearchParams(location.search);
      setView(VIEWS[q.get('view')] ? q.get('view') : 'overview');
      if (q.get('autumn') === '1') state.autumn = true;
      if (q.get('roof') === '0') state.roof = false;
      if (q.get('upstairs') === '0') state.upper = false;
      if (q.get('garage') === 'open') state.garageOpen = true;
      apply();

      /* ------------------------------------------------------------------
       * The loop, and the hook a capture script reads.
       * ------------------------------------------------------------------ */

      let frames = 0, waiters = [];
      const clock = new THREE.Clock();
      const fp = flagGeo.attributes.position;
      renderer.setAnimationLoop(() => {
        const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
        if (fly.on) stepFly(dt);
        else {
          controls.update();
          const p = camera.position, fy = floorAt(p.x, p.z) + 0.1;
          if (p.y < fy) p.y = fy;
        }
        for (let i = 0; i < fp.count; i++) {
          const x = flagRest[i * 3];
          fp.setZ(i, Math.sin(x * 4.2 - t * 3.0) * 0.05 * (x / 1.5) + Math.sin(x * 9 - t * 5) * 0.012 * (x / 1.5));
        }
        fp.needsUpdate = true;
        flagGeo.computeVertexNormals();
        renderer.render(scene, camera);
        frames++;
        if (frames === 3) window.__heads.ready = true;
        if (waiters.length) { const w = waiters; waiters = []; w.forEach((fn) => fn()); }
      });

      let info = null;
      window.__heads = {
        ready: false,
        views: Object.keys(VIEWS),
        notes: NOTES,
        view(name, extra = {}) {
          setView(name);
          Object.assign(state, extra);
          apply();
          return new Promise((res) => { waiters.push(() => waiters.push(() => res(true))); });
        },
        stats() {
          info = renderer.info.render;
          let meshes = 0;
          scene.traverse((o) => { if (o.isMesh) meshes++; });
          return { calls: info.calls, triangles: info.triangles, meshes, layers: Object.keys(LAYERS) };
        },
      };
    </script>
  </body>
</html>
