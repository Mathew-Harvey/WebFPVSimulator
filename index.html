      /* 16 by 9, so the thumbnail is the shape of the thing it is a
         thumbnail of. A looping clip of the title shot fills this box. */
      .map-reel {
        display: block; width: 100%; aspect-ratio: 16 / 9; background: #1a241c;
        position: relative; overflow: hidden;
      }
      .map-reel-view {
        position: absolute; inset: 0; width: 100%; height: 100%;
        border: 0; display: block; object-fit: cover; pointer-events: none;
        z-index: 0;
      }
      .map-card-still {
        position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 16 / 9;
        display: flex; align-items: center; justify-content: center;
        padding: 0 18px; box-sizing: border-box; text-align: center;
        color: var(--slate); font-size: 13px; line-height: 1.5;
      }
      .map-card-still:empty { display: none; }
      /* First-time clip wait. Same copy as the boot screen: "loading"
         and a joke. Cached visits never see it. */
      .map-reel-wait {
        position: absolute; inset: 0; z-index: 2;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 8px;
        padding: 12px 16px;
        box-sizing: border-box;
        text-align: center;
        background: radial-gradient(120% 90% at 50% 42%, #1e2a20, #101610);
        pointer-events: none;
      }
      .map-reel-wait-stage {
        font-size: 13px; letter-spacing: 0.06em; color: var(--cream);
      }
      .map-reel-wait-joke {
        font-size: 12px; line-height: 1.4; font-style: italic;
        color: var(--slate); max-width: 22em; min-height: 2.8em;
      }
      .map-card-body {
        display: flex; align-items: baseline; gap: 10px;
        padding: 10px 14px 12px;
      }
      .map-card-name { color: var(--cream); font-size: 17px; font-weight: 600; }
      .map-card.on .map-card-name { color: var(--sakura); }
      .map-card-tag {
        margin-left: auto; color: var(--mint); font-size: 11px;
        letter-spacing: 0.1em; text-transform: uppercase;
      }

      /*
       * The Courses screen. Worlds in one strip, courses in another, and
       * the courses are DRAWN: same plan the board and the builder draw,
       * from src/share/plan.js. This screen replaced three (Choose map,
       * Custom map, Create / edit map), each of which asked the player to
       * choose before showing them anything to choose between.
       */
      /* The PAGE scrolls, not a box inside it. Two card strips and seven
         rows do not fit a 900 px window, and a nested scroller inside a
         screen that is already too tall is two scrollbars arguing. The
         cursor's scrollIntoView drives this one. */
      .screen-courses {
        justify-content: flex-start;
        padding-top: 4vh;
        padding-bottom: 3vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        pointer-events: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .screen-courses > * { flex: 0 0 auto; }
      .card-strip { width: 100%; margin-bottom: 6px; }
      .strip-label {
        margin: 10px 0 2px;
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--sakura);
        text-align: center;
      }
      .screen-courses .map-cards { margin: 8px 0 2px; gap: 16px; }
      .screen-courses .map-card { width: min(236px, 82vw); }
      .screen-courses .map-card-name { font-size: 16px; }
      .course-card .map-reel { background: #0b1119; }
      .course-card canvas.plan {
        position: absolute; inset: 0;
        display: block; width: 100%; height: 100%;
      }
      .map-card-meta {
        padding: 0 14px 12px;
        color: var(--slate); font-size: 12px; letter-spacing: 0.02em;
      }
      .map-card-meta:empty { display: none; }

      /* The one badge, in the one vocabulary the builder and the board also
         use. See courseChip in src/share/listing.js: the label is decided
         there so the same course cannot be described two ways. */
      .course-chip {
        position: absolute; left: 10px; top: 10px; z-index: 3;
        padding: 3px 9px; border-radius: 999px;
        font-size: 10px; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase;
        background: rgba(11, 17, 25, 0.86);
        color: var(--slate);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.35);
        max-width: calc(100% - 20px);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .course-chip.tone-live {
        color: var(--mint);
        box-shadow: inset 0 0 0 1px rgba(125, 255, 180, 0.45);
      }
      .course-chip.tone-warn {
        color: var(--amber);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.5);
      }
      .board-note {
        width: 100%; margin: 4px 0 0; text-align: center;
        color: var(--slate); font-size: 13px;
      }
      .board-note:empty { display: none; }

      /*
       * How to fly. A CONTROL, NOT AN ESSAY.
       *
       * This screen was two definition lists over a two hundred word centred
       * paragraph, and the product already owned the thing that teaches a
       * stick: the gimbal pair the flight overlay and the calibration screen
       * both draw. So the sticks here are live, fed the same channels as the
       * quad, and the prose is cut to what a picture cannot say. One source
       * at a time: a keyboard pilot does not need the radio's five lines.
       */
      .howto-lede {
        max-width: 46em; margin: 0 0 18px;
        color: rgba(235, 230, 215, 0.78);
        font-size: 15px; line-height: 1.6; text-align: center;
      }
      .howto-tabs { display: flex; gap: 8px; pointer-events: auto; }
      .howto-tab {
        appearance: none; border: 0; border-radius: 3px;
        background: rgba(16, 22, 17, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.14);
        color: rgba(238, 232, 216, 0.72);
        font: inherit; font-size: 13px; font-weight: 650;
        letter-spacing: 0.1em; text-transform: uppercase;
        padding: 7px 16px; cursor: pointer;
      }
      .howto-tab:hover { color: var(--cream); }
      .howto-tab.on {
        background: rgba(232, 168, 184, 0.16);
        box-shadow: inset 0 0 0 1px var(--sakura);
        color: var(--cream);
      }
      .howto-body {
        display: flex; align-items: center; justify-content: center;
        gap: clamp(24px, 5vw, 64px); flex-wrap: wrap;
        margin: 22px 0 4px;
      }
      .howto-rig { display: flex; flex-direction: column; align-items: center; }
      .howto-sticks { display: flex; gap: 28px; align-items: flex-end; }
      .screen-howto .osd-gimbal-plate {
        width: clamp(96px, 12vw, 132px);
        height: clamp(96px, 12vw, 132px);
        background: rgba(12, 18, 14, 0.55);
      }
      .howto-live {
        margin-top: 12px; font-size: 12px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--amber); text-align: center;
      }
      .howto-keys { margin: 0; max-width: 34em; min-width: min(100%, 22em); }
      .howto-keys dt { color: var(--cream); font-size: 15px; font-weight: 600; margin-top: 12px; }
      .howto-keys dt:first-child { margin-top: 0; }
      .howto-keys dd { margin: 2px 0 0; color: var(--slate); font-size: 14px; line-height: 1.5; }
      .howto-mode {
        max-width: 52em; margin: 20px auto 0;
        color: rgba(235, 230, 215, 0.62);
        font-size: 13.5px; line-height: 1.6; text-align: center;
      }
      .howto-wiki {
        display: block; margin: 14px auto 0; padding: 8px 14px;
        border: 0; border-radius: 4px; cursor: pointer; pointer-events: auto;
        background: rgba(232, 168, 184, 0.16); color: var(--cream);
        font: inherit; font-size: 14px;
      }
      .howto-wiki:hover, .howto-wiki:focus-visible {
        background: rgba(232, 168, 184, 0.28);
      }

      .cols { display: flex; gap: 6vw; flex-wrap: wrap; justify-content: center; }
      .col { max-width: 30em; }
      .col dl { margin: 0; }
      .col dt { color: var(--cream); font-size: 15px; font-weight: 600; margin-top: 12px; }
      .col dd { margin: 2px 0 0; color: var(--slate); font-size: 14px; line-height: 1.5; }
      .lede {
        max-width: 58em; margin: 24px auto 0; color: var(--slate);
        font-size: 15px; line-height: 1.65; text-align: center;
      }

      /* Credits. A race programme over the live world, not a second
         landscape. Sections are ruled like a printed page, the beta roll
         is a start list with a slot number under each face, and every
         card that names a person opens that person's channel.

         WHY THE CARD CARRIES THE HOVER AND NOT THE HEADING. credits.js
         stretches the heading anchor's ::after over the whole card, so
         the pointer is over a live target anywhere on it. If only the
         heading lit up, most of that target would look dead. Hover is
         therefore a card state, and :focus-within is the same state
         arriving by keyboard. */
      .screen-credits {
        justify-content: flex-start;
        align-items: stretch;
        overflow-y: auto;
        overscroll-behavior: contain;
        pointer-events: auto;
        padding: 5vh 4vw 4vh;
      }
      .screen-credits h2 {
        align-self: center;
        margin-bottom: 8px;
      }
      .screen-credits h2::after {
        content: "";
        display: block;
        width: 36px; height: 2px;
        background: var(--sakura);
        margin: 10px auto 0;
      }
      .credits-roll {
        width: min(760px, 94vw);
        margin: 0 auto;
        pointer-events: auto;
      }
      .credits-lede {
        max-width: 46em;
        margin: 10px auto 26px;
        color: var(--slate);
        font-size: 15px;
        line-height: 1.65;
        text-align: center;
      }
      .credit-block { margin: 0 0 26px; }
      /* The kicker's rule runs out to the margin and fades there, so a
         section reads as a band across the page rather than a label
         floating above a box. */
      .credit-kicker {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--sakura);
        margin-bottom: 10px;
      }
      .credit-kicker::after {
        content: "";
        flex: 1 1 auto;
        height: 1px;
        background: linear-gradient(90deg, rgba(232, 168, 184, 0.42), rgba(232, 168, 184, 0));
      }
      .credit-block h3 {
        margin: 0 0 14px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-transform: none;
        color: var(--cream);
      }
      .credit {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 16px 16px;
        margin-bottom: 10px;
        background: rgba(16, 22, 17, 0.72);
        border-radius: 4px;
        border-top: 2px solid rgba(232, 168, 184, 0.28);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
      }
      /* A person card puts the face and the slot number in a left rail
         with the copy beside it. A project card keeps its mark across
         the top, because a wordmark wants the width. */
      .credit.person {
        display: grid;
        grid-template-columns: 64px 1fr;
        gap: 16px;
        align-items: start;
        padding: 16px;
      }
      /* The maker card is the one hero on the page, so it takes the
         brighter edge and the wider rail. */
      .credit.maker {
        grid-template-columns: 84px 1fr;
        padding: 20px;
        border-top-color: rgba(232, 168, 184, 0.55);
      }
      .credit.is-link {
        transition:
          transform 0.16s ease,
          border-top-color 0.16s ease,
          box-shadow 0.16s ease;
      }
      .credit.is-link:hover,
      .credit.is-link:focus-within {
        transform: translateY(-2px);
        border-top-color: var(--sakura);
        box-shadow:
          inset 0 0 0 1px rgba(244, 236, 214, 0.20),
          0 8px 20px rgba(6, 10, 7, 0.55);
      }
      .credit.is-link:focus-within {
        outline: 1px solid var(--sakura);
        outline-offset: 3px;
      }
      .credit.is-link h4 a { color: var(--cream); text-decoration: none; }
      /* The stretched anchor. Everything it covers is text, so nothing
         is buried that wanted a click of its own. The ring is on the
         card above, which is why the anchor drops its own. */
      .credit.is-link h4 a::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 4px;
      }
      .credit.is-link h4 a:focus-visible { outline: none; }
      .credit-stack {
        display: grid;
        justify-items: center;
        gap: 7px;
      }
      .credit-face {
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 4px;
        overflow: hidden;
        background: rgba(12, 18, 14, 0.55);
        box-shadow: 0 0 0 1px rgba(244, 236, 214, 0.16);
        transition: box-shadow 0.16s ease;
      }
      .credit.maker .credit-face { width: 84px; height: 84px; }
      .credit-face img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .credit-face.is-blank {
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.45);
      }
      .credit-face-mark {
        color: var(--sakura);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .credit.is-link:hover .credit-face,
      .credit.is-link:focus-within .credit-face {
        box-shadow: 0 0 0 1px var(--sakura);
      }
      /* The slot number is a start list's: the order they turned up, not
         a ranking. Amber because it is a reading off the page rather
         than a piece of chrome. */
      .credit-slot {
        font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        color: var(--amber);
      }
      .credit-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      @media (min-width: 640px) {
        .credit-row.pair { grid-template-columns: 1fr 1fr; }
      }
      /* The beta roll is one panel of ruled rows rather than four
         floating cards, because a start list is a list. Four identical
         boxes down a page say nothing about what they hold; four rows
         under one edge say these are the same kind of thing. */
      .credit-row.pilots {
        gap: 0;
        background: rgba(16, 22, 17, 0.72);
        border-radius: 4px;
        border-top: 2px solid rgba(232, 168, 184, 0.28);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        overflow: hidden;
      }
      /* A pilot row is a name, a number and a link out. Nothing is
         written under the name, so the copy sits against the middle of
         the face rather than starting level with the top of it. */
      .credit.pilot {
        margin: 0;
        padding: 14px 18px 14px 16px;
        align-items: center;
        background: none;
        border-top: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .credit.pilot .credit-copy h4 { margin-bottom: 0; }
      .credit.pilot .credit-handle { margin-top: 7px; }
      .credit.pilot + .credit.pilot { border-top: 1px solid rgba(244, 236, 214, 0.09); }
      /* A row's affordance is a bar down its leading edge, not a lift: a
         row in a list has nowhere to lift to without breaking the rules
         above and below it. */
      .credit.pilot::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--sakura);
        transform: scaleY(0);
        transform-origin: 50% 0;
        transition: transform 0.16s ease;
      }
      .credit.pilot.is-link:hover,
      .credit.pilot.is-link:focus-within {
        transform: none;
        background: rgba(232, 168, 184, 0.055);
        border-top-color: rgba(244, 236, 214, 0.09);
        box-shadow: none;
      }
      .credit.pilot.is-link:hover::before,
      .credit.pilot.is-link:focus-within::before { transform: scaleY(1); }
      /* The panel clips, so the focus ring has to be drawn inside it. */
      .credit.pilot.is-link:focus-within { outline-offset: -3px; }
      .credit-logo {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        min-height: 44px;
      }
      .credit-logo img, .credit-logo svg {
        display: block;
        height: 40px;
        width: auto;
        max-width: min(100%, 280px);
        object-fit: contain;
      }
      .credit-logo.light {
        background: var(--cream);
        border-radius: 4px;
        padding: 10px 14px;
        min-height: 0;
        align-self: flex-start;
      }
      .credit-logo.light img, .credit-logo.light svg { height: 32px; }
      /* The mark is the card's title, so when the fetch fails the words
         that replace it have to carry a title's weight. */
      .credit-logo-fallback {
        color: var(--cream);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .credit-title {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0;
        font-size: inherit;
        font-weight: inherit;
      }
      .credit.project { gap: 14px; }
      .credit-title a {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        border-radius: 4px;
      }
      /* Only for a mark that is a symbol rather than a name. Claude's
         starburst does not spell anything, so the word sits beside it. */
      .credit-title-text {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--cream);
      }
      .credit-title .credit-logo {
        opacity: 0.92;
        transition: opacity 0.16s ease;
      }
      .credit-title a:hover .credit-logo,
      .credit-title a:focus-visible .credit-logo { opacity: 1; }
      .credit-title a:focus-visible {
        outline: 1px solid var(--sakura);
        outline-offset: 4px;
      }
      .maker-mark {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: var(--cream);
        line-height: 1;
        text-shadow: 2px 2px 0 rgba(20, 28, 20, 0.82);
      }
      .maker-mark .fpv { color: var(--sakura); }
      .credit-copy h4 {
        margin: 0 0 7px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--cream);
      }
      .credit.maker .credit-copy h4 { margin-bottom: 10px; }
      .credit-copy p {
        margin: 0;
        color: var(--slate);
        font-size: 14px;
        line-height: 1.55;
      }
      /* Where the card goes. The play triangle is drawn here rather than
         fetched, so the line can say video without borrowing anybody's
         mark to do it. */
      .credit-handle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--slate);
        transition: color 0.16s ease;
      }
      .credit-handle::before {
        content: "";
        width: 0;
        height: 0;
        border-left: 8px solid currentColor;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
      }
      .credit.is-link:hover .credit-handle,
      .credit.is-link:focus-within .credit-handle { color: var(--sakura); }
      .credit-copy a, .credits-legal a {
        color: var(--sakura);
        text-decoration: none;
      }
      .credit-copy a:hover, .credits-legal a:hover { color: var(--cream); }
      .credits-legal {
        margin: 14px 0 6px;
        color: rgba(235, 230, 215, 0.55);
        font-size: 12px;
        line-height: 1.55;
        text-align: center;
      }
      /* Reduced motion drops the travel, never the state: the lift, the
         bar and the ring all still say the card is live, they just
         arrive without moving. */
      @media (prefers-reduced-motion: reduce) {
        .credit.is-link,
        .credit.is-link:hover,
        .credit.is-link:focus-within {
          transition: none;
          transform: none;
        }
        .credit.pilot::before { transition: none; }
      }
      /* Under about 560 the left rail costs more than the face is worth,
         so both shrink rather than the copy going to four words a line. */
      @media (max-width: 560px) {
        .credit.person {
          grid-template-columns: 52px 1fr;
          gap: 12px;
          padding: 14px;
        }
        .credit.maker { grid-template-columns: 64px 1fr; }
        .credit-face { width: 52px; height: 52px; }
        .credit.maker .credit-face { width: 64px; height: 64px; }
        .credit-face-mark { font-size: 15px; }
        .maker-mark { font-size: 24px; }
        .credit-copy h4 { font-size: 17px; }
      }
      .screen-credits .menu-stage {
        width: min(760px, 94vw);
        margin: 12px auto 0;
        display: block;
      }
      .screen-credits .menu {
        min-width: 0;
        width: 100%;
        margin-top: 0;
      }
      .screen-credits .hint { margin-left: auto; margin-right: auto; }

      .screen-modal { background: rgba(12, 18, 14, 0.72); }

      /* Finish. Same HUD hole as the title: the frozen craft and the
         course sit in the open side, the times own the left (or the
         bottom on a phone). */
      .screen-results {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: stretch;
        width: 100%;
        height: 100%;
        padding: 4.5vh 4vw 3vh;
        background:
          linear-gradient(90deg, rgba(12, 18, 14, 0.84) 0%, rgba(12, 18, 14, 0.50) 28%, rgba(12, 18, 14, 0.10) 54%, rgba(12, 18, 14, 0.12) 100%),
          linear-gradient(180deg, rgba(12, 18, 14, 0.28) 0%, transparent 22%, transparent 64%, rgba(12, 18, 14, 0.40) 100%);
      }
      .results-copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: min(38em, 46vw);
        height: 100%;
        min-width: 0;
        min-height: 0;
        z-index: 1;
        align-self: flex-start;
      }
      .results-top { min-height: 0; }
      .results-kicker {
        display: flex; align-items: center; gap: 12px;
        font-size: clamp(13px, 1.4vw, 16px); color: #d8d2c0;
        letter-spacing: 0.28em; text-transform: uppercase;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
      }
      .results-kicker:empty { display: none; }
      .results-kicker::before {
        content: "";
        width: 36px; height: 2px; flex: 0 0 auto;
        background: var(--sakura);
      }
      .screen-results .results-head {
        margin: 14px 0 0; font-size: clamp(22px, 3.2vw, 36px); font-weight: 700;
        letter-spacing: 0.04em; color: var(--cream);
        text-shadow: 2px 2px 0 rgba(20, 28, 20, 0.82), 0 8px 22px rgba(0, 0, 0, 0.32);
      }
      .screen-results.is-record .results-head { color: var(--mint); }
      .results-hero { margin-top: 10px; }
      .screen-results.is-empty .results-hero { display: none; }
      .results-hero-cap {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--slate);
      }
      .results-hero-time {
        margin-top: 2px;
        font-size: clamp(56px, 9vw, 112px); font-weight: 800;
        letter-spacing: 0.02em; line-height: 0.92; color: var(--cream);
        text-shadow: 3px 3px 0 rgba(20, 28, 20, 0.82), 0 10px 28px rgba(0, 0, 0, 0.32);
      }
      .screen-results.is-record .results-hero-time {
        color: var(--mint);
        text-shadow: 3px 3px 0 rgba(20, 28, 20, 0.82), 0 0 32px rgba(125, 255, 180, 0.28);
      }
      .results-hero-meta {
        margin-top: 10px; font-size: 15px; color: var(--slate);
        letter-spacing: 0.03em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .results-hero-meta.gain { color: var(--mint); }
      .results-hero-meta.off { color: var(--sakura); }
      .results {
        min-width: 0; width: 100%;
        margin: 18px 0 0;
        max-height: min(calc(32vh - var(--bars)), 16em);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .results-empty {
        margin: 0; color: var(--slate); font-size: 15px; line-height: 1.55;
        max-width: 34em;
      }
      /* One line about the ghost that was chased, under the lap rows. Mint
         for the same reason the ghost itself is: it is a record, flying. */
      .results-ghost {
        margin: 10px 0 0; color: var(--mint); font-size: 14px; line-height: 1.5;
      }
      .result-row {
        padding: 8px 0 10px;
        border-bottom: 1px solid rgba(244, 236, 214, 0.12);
      }
      .result-main {
        display: flex; align-items: baseline; gap: 12px; font-size: 18px;
      }
      .result-label { color: var(--slate); min-width: 4.6em; }
      .result-time { color: var(--cream); font-weight: 600; margin-left: auto; }
      .result-tag { color: var(--mint); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
      .result-row.void .result-time { color: #93a7ba; font-weight: 400; }
      .result-why { color: #7f95ab; font-size: 12px; letter-spacing: 0.06em; max-width: 16em; }
      .result-row.total { border-bottom: none; margin-top: 4px; }
      .result-row.total .result-time { color: var(--sakura); }
      .result-bar {
        height: 3px; margin-top: 7px; border-radius: 2px;
        background: rgba(12, 18, 14, 0.55);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.22);
        overflow: hidden;
      }
      .result-bar-fill {
        height: 100%; width: 0; background: rgba(243, 234, 212, 0.55);
      }
      .result-row.fastest .result-bar-fill { background: var(--mint); }
      /* The course the lap was flown on. Same drawing as the Courses cards
         and the public board, from src/share/plan.js. */
      .results-plan {
        margin: 14px 0 0;
        width: min(100%, 26em);
        border-radius: 4px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
      }
      .results-plan[hidden] { display: none; }
      .results-plan canvas.plan {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
      }
      @media (max-height: 720px) { .results-plan { display: none; } }
      .results-note {
        margin: 14px 0 0; color: rgba(235, 230, 215, 0.72);
        font-size: 13.5px; line-height: 1.55; max-width: 34em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .results-note:empty { display: none; }
      .results-foot {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-end;
        gap: 14px;
        width: 100%;
        margin-top: auto;
        position: relative;
      }
      .screen-results .menu-stage {
        display: block;
        position: static;
        width: 100%;
        margin-top: 0;
        flex: 0 0 auto;
      }
      .screen-results .menu {
        min-width: 0; width: 100%; margin-top: 0;
        background: rgba(16, 22, 17, 0.55);
      }
      .screen-results .menu-scroll { max-height: min(calc(34vh - var(--bars)), 16em); }
      .screen-results .menu-help {
        position: absolute;
        left: 0; right: 0; bottom: 100%;
        width: auto; max-width: none;
        margin: 0; padding: 0 4px 10px;
        height: auto; text-align: left; border: none;
        overflow: visible; pointer-events: none;
        grid-column: auto; grid-row: auto;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .screen-results .menu-help:empty { padding: 0; }
      @keyframes results-rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
      }
      .screen-results.is-in .results-top {
        animation: results-rise 0.48s ease both;
      }
      @media (prefers-reduced-motion: reduce) {
        .screen-results.is-in .results-top { animation: none; }
      }
      @media (max-width: 860px) {
        .screen-results {
          padding: 2.6vh 4.5vw 2vh;
          background:
            linear-gradient(180deg, rgba(12, 18, 14, 0.28) 0%, rgba(12, 18, 14, 0.08) 18%, rgba(12, 18, 14, 0.10) 42%, rgba(12, 18, 14, 0.88) 100%);
        }
        .results-copy { width: 100%; }
        .results-hero-time { font-size: clamp(44px, 16vw, 76px); }
        .results { max-height: min(22vh, 10em); }
        .screen-results .menu-scroll { max-height: min(28vh, 12em); }
      }
      @media (max-height: 520px) {
        .screen-results .results-kicker,
        .screen-results .results-note,
        .screen-results .results-hero-cap {
          display: none;
        }
        .results-hero-time { font-size: clamp(36px, 12vh, 56px); }
        .results { max-height: min(18vh, 7em); }
        .screen-results .menu-scroll { max-height: min(36vh, 9em); }
      }

      /* Loading. This markup is STATIC, and that is the point: it paints on
         the first layout, before the import map has resolved a single module,
         so the three.js fetch is a stage the player can see rather than a
         blank page. src/ui/loading.js only ever writes into it. */
      #loading {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: radial-gradient(120% 90% at 50% 42%, #1e2a20, #101610);
        font-family: var(--ui-font); color: var(--cream);
        font-variant-numeric: tabular-nums;
        transition: opacity 0.3s ease;
      }
      #loading[hidden] { display: none; }
      .loading-stage {
        font-size: clamp(18px, 2.4vw, 22px); letter-spacing: 0.06em;
        color: var(--cream);
      }
      .loading-joke {
        margin-top: 12px; font-size: 15px; line-height: 1.45;
        font-style: italic; color: var(--slate);
        max-width: 28em; min-height: 2.2em; text-align: center;
      }
      /* The failure panel. Only ever painted by fail(), which is why it
         carries its own type sizes rather than inheriting the calm ones
         above: this is the one moment the screen has to be read rather
         than glanced at. */
      .loading-help {
        margin-top: 22px; max-width: 34em; text-align: left;
        color: var(--cream); font-size: 14.5px; line-height: 1.55;
      }
      .loading-help h3 {
        margin: 0 0 10px; font-size: 13px; font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber);
      }
      .loading-help ol { margin: 0; padding-left: 1.3em; }
      .loading-help li { margin-bottom: 9px; }
      .loading-help li:last-child { margin-bottom: 0; }
      .loading-help b { color: var(--cream); font-weight: 700; }
      .loading-help .loading-why {
        margin: 0 0 14px; color: var(--slate);
      }
      .loading-help .loading-detail {
        margin-top: 16px; padding-top: 12px;
        border-top: 1px solid rgba(244, 236, 214, 0.16);
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11.5px; color: #7f9188; word-break: break-word;
      }
      .loading-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
      .loading-actions button {
        font: inherit; font-size: 14.5px; font-weight: 700;
        padding: 10px 20px; border: 0; border-radius: 3px; cursor: pointer;
        background: var(--mint); color: var(--deep);
      }
      .loading-actions button.quiet {
        background: transparent; color: var(--cream); font-weight: 600;
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.3);
      }
      .loading-actions button:focus-visible {
        outline: 2px solid var(--cream); outline-offset: 2px;
      }
      .loading-joke.is-error {
        font-style: normal; color: #ff8f8f;
      }
      .loading-track {
        width: min(420px, 68vw); height: 5px; border-radius: 3px;
        margin-top: 28px;
        background: rgba(16, 22, 17, 0.8);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.28);
        overflow: hidden;
      }
      .loading-fill {
        height: 100%; width: 0%; background: var(--sakura);
        transition: width 0.15s linear;
      }

      .name-dialog {
        position: absolute; inset: 0; z-index: 8;
        display: flex; align-items: center; justify-content: center;
        background: rgba(12, 18, 14, 0.72);
        pointer-events: auto;
        user-select: text;
      }
      .name-dialog[hidden] { display: none; }
      .name-dialog-box {
        width: min(420px, 86vw); padding: 22px 24px 20px;
        background: var(--panel); border-radius: 4px;
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.35), 0 18px 40px rgba(0, 0, 0, 0.55);
      }
      .name-dialog-box.bug {
        width: min(520px, 92vw);
        max-height: min(88vh, 740px);
        overflow-y: auto;
      }
      .name-dialog-box h2 {
        margin: 0 0 10px; font-size: 22px; color: var(--cream);
      }
      .name-dialog-box .lede {
        margin: 0 0 10px; text-align: left; max-width: none; font-size: 14px;
      }
      .name-dialog-label {
        margin: 12px 0 0; font-size: 11px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--slate);
      }
      .name-dialog-input {
        display: block; width: 100%; box-sizing: border-box;
        margin: 8px 0 4px; padding: 9px 11px;
        background: #121a14; border: 1px solid rgba(244, 236, 214, 0.16);
        border-radius: 4px; color: var(--cream); font: inherit; font-size: 16px;
      }
      .name-dialog-area { min-height: 4.5em; resize: vertical; }
      .name-dialog-input:focus {
        outline: none; border-color: var(--sakura);
      }
      .name-dialog-err {
        min-height: 1.3em; margin: 0 0 10px; color: #ff8f8f; font-size: 12px;
      }
      /* The door from the bug form to the flight feel form: a sentence that
         acts like a link, not a second primary button, because it leaves
         the form rather than submitting it. */
      .name-dialog-door {
        appearance: none; border: 0; background: transparent; padding: 0;
        margin: 0 0 6px; color: var(--mint); font: inherit; font-size: 13px;
        text-align: left; cursor: pointer; text-decoration: underline;
        text-underline-offset: 3px;
      }
      .name-dialog-door:hover { color: var(--cream); }
      .name-dialog-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .name-dialog-btn {
        appearance: none; border: 1px solid rgba(244, 236, 214, 0.16);
        background: #121a14; color: var(--slate); font: inherit;
        padding: 7px 14px; border-radius: 4px; cursor: pointer;
      }
      .name-dialog-btn.on {
        background: var(--mint); border-color: var(--mint);
        color: var(--deep); font-weight: 600;
      }
      .name-dialog-btn:disabled { opacity: 0.45; cursor: default; }
      /* Discard, on the unsaved guard. The only button in this product
         that throws work away, so it is the only one wearing a warning
         colour: quiet until the pointer is on it, and never the default. */
      .name-dialog-btn.danger { color: #ff8f8f; border-color: rgba(255, 143, 143, 0.35); }
      .name-dialog-btn.danger:hover { color: var(--deep); background: #ff8f8f; border-color: #ff8f8f; }
      /*
       * The flight feel question's answers are CHIPS, not a select, because
       * the whole form is meant to be answered in two clicks and a select
       * hides its options behind one of them. Same surface treatment as the
       * dialog inputs; the chosen chip goes mint like the Send button, so
       * "chosen" and "go" read as the same colour system.
       */
      .feel-chips {
        display: flex; flex-wrap: wrap; gap: 6px;
        margin: 8px 0 4px;
      }
      .feel-chip {
        appearance: none; border: 1px solid rgba(244, 236, 214, 0.16);
        background: #121a14; color: var(--cream); font: inherit;
        font-size: 13px; padding: 6px 11px; border-radius: 999px;
        cursor: pointer;
      }
      .feel-chip:hover { border-color: var(--sakura); }
      .feel-chip.on {
        background: var(--mint); border-color: var(--mint);
        color: var(--deep); font-weight: 600;
      }
      .bug-chip {
        position: absolute; top: 16px; right: 16px; z-index: 7;
        pointer-events: auto;
        appearance: none; border: 1px solid rgba(232, 168, 184, 0.45);
        background: rgba(16, 22, 17, 0.82); color: var(--cream);
        font: 600 12px/1 var(--ui-font); letter-spacing: 0.06em;
        padding: 8px 12px; border-radius: 4px; cursor: pointer;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      }
      /* Live flight: same corner, a shade quieter so the FPV frame still
         reads, still a real button. Click pauses, then opens the form. */
      .bug-chip.on-flight {
        background: rgba(16, 22, 17, 0.55);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }
      .bug-chip:hover { border-color: var(--sakura); color: var(--sakura); }
      .bug-chip[hidden] { display: none; }

      /* Music skip. Tiny, out of the FPV instruments. Menus park it under
         the bug chip at the top right, over the open world rather than
         over the list. Flight puts it top left, away from the timer, the
         pack, and the bug chip. Buttons never take focus, so a click
         cannot steal Space from throttle. */
      .music-dock {
        position: absolute; right: 16px; top: 52px; z-index: 6;
        display: flex; align-items: center; gap: 4px;
        pointer-events: auto;
        padding: 3px 6px 3px 3px; border-radius: 4px;
        background: rgba(16, 22, 17, 0.50);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.16);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }
      .music-dock.on-flight {
        right: auto; left: 16px; top: 16px;
        background: rgba(16, 22, 17, 0.38);
      }
      .music-dock.is-muted { opacity: 0.5; }
      .music-dock[hidden] { display: none; }
      .music-skip {
        appearance: none; border: 0; border-radius: 3px;
        width: 26px; height: 24px; padding: 0;
        background: rgba(232, 168, 184, 0.14); color: var(--cream);
        font: 700 16px/1 var(--ui-font); cursor: pointer;
      }
      .music-skip:hover { background: rgba(232, 168, 184, 0.32); color: var(--sakura); }
      .music-title {
        max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-size: 11px; letter-spacing: 0.04em; color: var(--cream);
      }
      @media (max-width: 520px) {
        .music-title { max-width: 6.5em; font-size: 10px; }
      }

      /* The target mark. A bracket on the next gate while it is in frame,
         a chevron pinned inside the edge while it is not, and the range
         under either. Green while the pilot is on the side the gate is
         flown from, red while they are not, which is the same half space
         the gate itself is coloured by: the display and the world must
         never disagree about which way through.

         currentColor everywhere, so the side is one class on the root and
         not four colour writes a frame. Transform only, no width or top,
         so tracking a gate at 30 m/s costs a composite and not a layout. */
      .lock {
        position: absolute; left: 0; top: 0; pointer-events: none;
        color: #39ff8b;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.9));
        will-change: transform;
      }
      .lock.is-off { display: none; }
      .lock.is-wrong { color: #ff5a5a; }
      .lock-box {
        position: absolute; left: 0; top: 0;
        transform: translate(-50%, -50%);
      }
      .lock.is-edge .lock-box { display: none; }
      /* Corner ticks, not a closed rectangle. A box drawn round an opening
         reads as a second gate; four ticks read as an instrument. */
      .lock-box .lc {
        position: absolute; width: 24%; height: 24%;
        border: 2px solid currentColor;
      }
      .lock-box .lc.tl { left: 0; top: 0; border-right: 0; border-bottom: 0; }
      .lock-box .lc.tr { right: 0; top: 0; border-left: 0; border-bottom: 0; }
      .lock-box .lc.bl { left: 0; bottom: 0; border-right: 0; border-top: 0; }
      .lock-box .lc.br { right: 0; bottom: 0; border-left: 0; border-top: 0; }
      /* The chevron is the state where the pilot cannot see the target at
         all, so it is the loudest thing this mark ever draws: bigger than
         the bracket's ticks, and breathing, because a still triangle on the
         edge of a moving frame is a thing the eye stops reporting. */
      .lock-arrow {
        position: absolute; left: 0; top: 0; display: none;
        width: 0; height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-bottom: 27px solid currentColor;
        transform-origin: 50% 50%;
      }
      .lock.is-edge .lock-arrow { display: block; }
      /* Shallow on purpose. Deep enough to catch the eye at the edge of the
         frame, never so deep that the chevron is missing from a frame: a
         marker that is sometimes absent is a marker a pilot learns to
         distrust, and a capture of one is evidence of nothing. */
      .lock.is-edge { animation: lock-hunt 1.15s ease-in-out infinite; }
      @keyframes lock-hunt {
        50% { opacity: 0.72; }
      }
      .lock-dist {
        position: absolute; left: 0; top: 0;
        font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
        color: currentColor; white-space: nowrap;
      }
    </style>
    <!-- Three.js only, pinned. The addons path is the same package, used
         for the post processing chain; nothing else is on the render
         side. See PROGRESS.md. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="loading-stage">loading</div>
      <div class="loading-joke">"I complimented my quad on its propellers. It said thanks for the props."</div>
      <div class="loading-track"><div class="loading-fill"></div></div>
      <!-- Empty until something fails. See fail() in src/ui/loading.js: a
           boot that dies used to leave a red bar, a sentence and no way
           out, which is a dead end on the one screen a stranded visitor is
           looking at. aria-live so a screen reader hears the failure. -->
      <div class="loading-help" hidden role="alert" aria-live="assertive"></div>
    </div>
    <!-- boot.js, not main.js. It imports nothing at module scope except the
         loading screen, so the screen is alive and reporting BEFORE the
         three.js fetch begins. main.js imports three statically and is itself
         one of boot's stages. -->
    <script type="module" src="src/boot.js"></script>
  </body>
</html>
