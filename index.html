<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebFPVSimulator</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #202428; }
      #view { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 10px; top: 10px; color: #d8dce0;
        font: 12px/1.5 monospace; white-space: pre; user-select: none;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none;
      }
      #msg {
        position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
        color: #ffd257; font: bold 22px monospace; text-align: center;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9); pointer-events: none; white-space: pre;
      }
    </style>
    <!-- Three.js only, pinned. The addons path is the same package, used
         for the post processing chain; nothing else is on the render
         side. See PROGRESS.md. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="msg"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
