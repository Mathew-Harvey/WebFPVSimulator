<!doctype html>
<!--
  WebFPVSimulator: the page. A canvas for the world, an overlay for the
  product shell (title, how to fly, credits, settings, pause, results, and the
  flight display). The overlay's structure is built in src/ui/ui.js; its
  styling lives here with the rest of the page's CSS.

  Colour rule: light is warm, shadow is cool. Cream for lit type. Sakura
  for chrome (menus, the wordmark's FPV). Amber for instruments that have
  to read over live footage. Mint for a record. Recessed type stays a
  cool mist so it still recedes on grass and sky. The title and the
  finish screen do not paint a second landscape and do not load a
  webfont: the world behind the menu is the picture, and the overlay
  is CSS. Mint on the finish hero is a record.

  This file is part of WebFPVSimulator.

  WebFPVSimulator is free software: you can redistribute it and/or modify
  it under the terms of the GNU General Public License as published by
  the Free Software Foundation, either version 3 of the License, or (at
  your option) any later version.

  WebFPVSimulator is distributed in the hope that it will be useful, but
  WITHOUT ANY WARRANTY, without even the implied warranty of
  MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the GNU
  General Public License for more details.

  You should have received a copy of the GNU General Public License
  along with WebFPVSimulator. If not, see <https://www.gnu.org/licenses/>.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebFPV, a browser FPV racing simulator</title>
    <!--
      The mark is four propellers, an X frame and the stack in the middle, one
      shape shared by all four pages in the family with one accent each, so a
      pilot with the simulator, the builder and the board open at once can
      tell three tabs apart without reading them. This one is sakura, which is
      the colour of the FPV in the wordmark. scripts/icons.js draws them all.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#141c16" />
    <style>
      :root {
        --cream: #f3ead4;
        --sakura: #e8a8b8;
        --amber: #ffd45c;
        --mint: #7dffb4;
        --slate: #9db3c8;
        --deep: #141c16;
        --panel: #1a241c;
        --ink: rgba(12, 18, 14, 0.86);
        --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--deep); }
      #view {
        display: block; position: fixed; inset: 0;
        width: 100%; height: 100%;
      }
      #ui {
        position: fixed; inset: 0; pointer-events: none; user-select: none;
        font-family: var(--ui-font); color: var(--cream);
        font-variant-numeric: tabular-nums;
      }

      /* Flight display. Thin warm type over a dark edge, the way an OSD
         reads over any background. */
      .osd { position: absolute; inset: 0; }
      .osd.dim { opacity: 0.4; }
      .osd-top {
        position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
        text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.85);
      }
      .osd-timer { font-size: 46px; font-weight: 600; letter-spacing: 0.02em; line-height: 1; }
      .osd-timer.waiting { color: #b9c9d8; }
      .osd-label {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--slate); margin-bottom: 2px;
      }
      .osd-value { font-size: 20px; font-weight: 600; }
      .osd-sub { font-size: 13px; color: var(--slate); margin-top: 1px; margin-bottom: 8px; }
      .osd-gate { font-size: 15px; color: var(--amber); margin-top: 6px; letter-spacing: 0.08em; text-transform: uppercase; }
      .osd-best { font-size: 14px; color: var(--slate); margin-top: 3px; }
      .osd-corner {
        position: absolute; bottom: 20px; width: 190px;
        text-shadow: 0 2px 6px rgba(0,0,0,0.85); font-size: 15px;
      }
      .osd-left { left: 22px; }
      .osd-right { right: 22px; text-align: right; }
      .osd-mode { letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); }
      .osd-launch {
        position: absolute; left: 50%; top: 16%;
        transform: translate(-50%, 0);
        font-size: clamp(28px, 4.2vw, 46px); font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--amber);
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.92);
        pointer-events: none;
      }
      .osd-launch.is-off { display: none; }
      .osd-launch.is-hot { animation: launch-blink 0.32s step-end infinite; }
      .osd-launch.is-go {
        color: #8dffb0;
        letter-spacing: 0.32em;
        font-size: clamp(40px, 6vw, 64px);
      }
      @keyframes launch-blink {
        50% { opacity: 0.2; }
      }
      .bar {
        height: 5px; margin-top: 7px; border-radius: 3px;
        background: rgba(12, 22, 34, 0.65);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.35);
        overflow: hidden;
      }
      .bar-fill { height: 100%; width: 0%; background: var(--mint); transition: width 0.12s linear; }
      .bar-fill.warm { background: var(--amber); }
      .osd-hits { margin-top: 10px; margin-bottom: 0; }
      .osd-hits.warn { color: var(--amber); }

      /* Keyboard stick ghost. Two Mode 2 gimbals: left is yaw and
         throttle, right is roll and pitch. Shown only when the keyboard
         is the stick source, so a radio does not grow a second pair of
         sticks. Transparent enough to read a gate through. */
      .osd-sticks {
        position: absolute; left: 50%; bottom: 18px;
        transform: translateX(-50%);
        display: flex; align-items: flex-end; gap: 22px;
        pointer-events: none;
      }
      .osd-sticks.is-off { display: none; }
      .osd-gimbal-plate {
        position: relative;
        width: clamp(64px, 11vw, 88px);
        height: clamp(64px, 11vw, 88px);
        border-radius: 4px;
        background: rgba(12, 18, 14, 0.28);
        box-shadow: inset 0 0 0 1px rgba(243, 234, 212, 0.32);
      }
      .osd-cross-x, .osd-cross-y {
        position: absolute;
        background: rgba(157, 179, 200, 0.32);
      }
      .osd-cross-x { left: 10%; right: 10%; height: 1px; top: 50%; }
      .osd-cross-y { top: 10%; bottom: 10%; width: 1px; left: 50%; }
      .osd-nub {
        position: absolute; left: 50%; top: 50%;
        width: 11px; height: 11px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 0 1px rgba(12, 18, 14, 0.55), 0 1px 6px rgba(0, 0, 0, 0.45);
        transform: translate(-50%, -50%);
      }
      .osd-gimbal-cap {
        margin-top: 6px;
        font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--slate); text-align: center;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }

      .banner.panel {
        background: rgba(16, 22, 17, 0.9); border-radius: 4px;
        padding: 20px 30px; box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.3);
        font-size: 24px; color: var(--cream); line-height: 1.45;
      }
      .banner {
        /* 22 percent, not 38. A regulation gate's aperture centre sits at
           0.762 m and the FPV camera is tilted up, so the target lands low in
           the frame, and a pilot found the launch banner drawn directly over
           the one thing they need to find. */
        position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%);
        text-align: center; white-space: pre-line; font-size: 30px; font-weight: 600;
        letter-spacing: 0.04em; color: var(--amber); opacity: 0;
        transition: opacity 0.18s ease; text-shadow: 0 3px 10px rgba(0,0,0,0.9);
      }

      .readout {
        position: absolute; right: 16px; top: 14px; display: none;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--slate); white-space: pre; text-align: right;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      }

      /* Screens. */
      .screen {
        position: absolute; inset: 0; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 4vh 6vw; box-sizing: border-box;
        /* Enough scrim to read type over a bright valley, not enough to
           turn a warm afternoon into night. Forest-tinted, not navy. */
        background:
          radial-gradient(120% 90% at 50% 42%, rgba(18, 26, 18, 0.58), rgba(12, 18, 14, 0.76));
      }
      /* The title is a HUD over the live map. Copy on the left (or top
         and bottom on a phone), the world and the flying airframe fill
         the rest. The wash is a hole, not a second landscape. */
      .screen-title {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: stretch;
        width: 100%;
        height: 100%;
        padding: 4.5vh 4vw 3vh;
        background:
          linear-gradient(90deg, rgba(12, 18, 14, 0.78) 0%, rgba(12, 18, 14, 0.42) 26%, rgba(12, 18, 14, 0.08) 52%, rgba(12, 18, 14, 0.10) 100%),
          linear-gradient(180deg, rgba(12, 18, 14, 0.32) 0%, transparent 22%, transparent 64%, rgba(12, 18, 14, 0.38) 100%);
      }
      .title-copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: min(36em, 46vw);
        height: 100%;
        min-width: 0;
        min-height: 0;
        z-index: 1;
      }
      .screen-page { justify-content: center; }
      .screen-maps {
        justify-content: flex-start;
        padding-top: 7vh;
      }
      .screen h1, .wordmark {
        margin: 0; font-size: clamp(44px, 8vw, 104px); font-weight: 800;
        letter-spacing: 0.08em; padding-left: 0.02em; color: var(--cream);
        line-height: 0.92;
        text-shadow: 3px 3px 0 rgba(20, 28, 20, 0.82), 0 10px 28px rgba(0, 0, 0, 0.32);
      }
      .wordmark .fpv { color: var(--sakura); }
      .screen h2 {
        margin: 0 0 18px; font-size: clamp(24px, 3.4vw, 40px); font-weight: 700;
        letter-spacing: 0.04em; color: var(--cream);
      }
      .screen-maps h2 {
        align-self: flex-start;
        margin-bottom: 8px;
      }
      .screen-maps h2::after {
        content: "";
        display: block;
        width: 36px; height: 2px;
        background: var(--sakura);
        margin-top: 10px;
      }
      .screen h3 {
        margin: 0 0 10px; font-size: 15px; font-weight: 700; color: var(--sakura);
        letter-spacing: 0.12em; text-transform: uppercase;
      }
      .brand { text-align: center; margin-bottom: 34px; }
      .screen-title .brand {
        text-align: left;
        margin-bottom: 0;
        max-width: 36em;
      }
      .brand-sub {
        display: flex; align-items: center; gap: 12px;
        margin-top: 12px; font-size: clamp(13px, 1.4vw, 16px); color: #d8d2c0;
        letter-spacing: 0.28em; text-transform: uppercase;
      }
      .brand-sub:empty, .brand-best:empty { display: none; }
      .brand-sub::before {
        content: "";
        width: 36px; height: 2px; flex: 0 0 auto;
        background: var(--sakura);
      }
      .brand-best {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 16px; padding: 7px 14px; border-radius: 3px;
        font-size: 14px; color: var(--cream); letter-spacing: 0.05em;
        background: rgba(16, 22, 17, 0.62);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.45);
      }
      .brand-best-time { color: var(--mint); font-weight: 650; }
      .keep-note {
        max-width: 34em; margin: 14px 0 0; color: rgba(235, 230, 215, 0.72);
        font-size: 13.5px; line-height: 1.6; letter-spacing: 0.01em;
      }
      /* First run swaps the storage warning, which is a returning pilot's
         problem, for the one sentence that gets somebody airborne. */
      /* :not(.first-note) because the first note IS a keep-note, so the
         plain .keep-note hide below would match it at the same specificity
         and, being later, win. */
      .first-note { display: none; }
      .screen-title.is-first .first-note { display: block; }
      .screen-title.is-first .keep-note:not(.first-note),
      .screen-title.is-first .brand-best { display: none; }
      .screen-title .brand-sub {
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
      }
      .screen-title .keep-note {
        margin-left: 0;
        margin-right: auto;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }

      /* The menu is a fixed-width centre column. Help text lives in the
         right column so a long note cannot grow the list and shove the
         whole screen around. 1fr / auto / 1fr keeps the rows centred.
         The title pins the same note ABOVE the footer, out of flow, so
         a longer hover line cannot drop the rows. */
      /* SYMMETRIC, so the menu is centred where the heading says it is.
         The columns used to be 1.7fr / auto / 0.65fr, which put the panel
         195 px right of a centred h2 on a 1440 px screen: the heading and
         the thing it names did not line up on Paused or How to fly. The
         screens that fill column one (Settings' airframe studio) override
         this below; nothing else was using the extra width. */
      .menu-stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        width: min(1600px, 98vw);
        align-items: start;
        margin-top: 22px;
        pointer-events: none;
      }
      .screen-settings .menu-stage {
        width: 100%;
        max-width: 1600px;
        grid-template-columns: minmax(360px, 1.7fr) auto minmax(0, 0.65fr);
      }
      /*
       * Settings on a laptop. NOT part of the flight-controller removal, but
       * found by measuring the Rates screen beside it: below about 1100 px
       * the three columns cannot fit their own minimums (360 for the quad
       * plus 540 for the menu is already 900 before the note column), so the
       * stage overflowed and the menu slid off the right of the window
       * entirely. One column, quad on top, same fallback Rates takes.
       */
      @media (max-width: 1100px) {
        .screen-settings .menu-stage { grid-template-columns: minmax(0, 1fr); }
        .screen-settings .craft-showcase {
          grid-column: 1; grid-row: 1;
          justify-self: center; width: min(100%, 420px); margin: 0 0 12px;
        }
        .screen-settings .menu-stage .menu { grid-column: 1; justify-self: center; }
        .screen-settings .menu-help {
          grid-column: 1; max-width: none; border-left: 0;
          padding: 8px 14px 0; margin-top: 6px; text-align: center;
        }
      }
      .title-foot {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-end;
        gap: 14px;
        width: 100%;
        margin-top: auto;
        position: relative;
      }
      .screen-title .menu-stage {
        display: block;
        position: static;
        width: 100%;
        margin-top: 0;
        flex: 0 0 auto;
      }
      .menu {
        min-width: min(540px, 82vw);
        margin-top: 16px;
        pointer-events: auto;
        padding: 10px 0 12px;
        border-radius: 4px;
        background: rgba(16, 22, 17, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        border-top: 2px solid rgba(232, 168, 184, 0.55);
      }
      .screen-title .menu { min-width: 0; width: 100%; margin-top: 0; background: rgba(16, 22, 17, 0.55); }
      .menu-stage .menu { grid-column: 2; margin-top: 0; }
      .menu-scroll {
        max-height: min(58vh, 34em);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .menu-help {
        grid-column: 3;
        padding: 12px 12px 8px 22px;
        margin-top: 8px;
        max-width: 26em;
        color: rgba(235, 230, 215, 0.72);
        font-size: 14px;
        line-height: 1.55;
        overflow-wrap: break-word;
        border-left: 1px solid rgba(244, 236, 214, 0.16);
      }
      .menu-help:empty { border-left-color: transparent; padding: 0; }
      .screen-title .menu-help {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100%;
        width: auto;
        max-width: none;
        margin: 0;
        padding: 0 4px 10px;
        height: auto;
        text-align: left;
        border: none;
        overflow: visible;
        pointer-events: none;
        grid-column: auto;
        grid-row: auto;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .screen-title .menu-help:empty {
        padding: 0;
      }
      .craft-showcase {
        grid-column: 1;
        justify-self: end;
        align-self: center;
        width: min(100%, 760px);
        margin-right: 12px;
        pointer-events: auto;
        overflow: hidden;
        border-radius: 16px;
        background: #1a241c;
        box-shadow: 0 18px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(244, 236, 214, 0.10);
      }
      .craft-showcase-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #1a241c;
      }
      .craft-view {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #1a241c;
        touch-action: none;
      }
      .craft-showcase-cap {
        margin-top: 4px;
        padding: 0 10px 12px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: #b7c4b0;
      }
      .row {
        display: flex; justify-content: space-between; align-items: center; gap: 16px;
        padding: 10px 22px 10px 28px; border-left: 4px solid transparent;
        color: rgba(238, 232, 216, 0.78);
        font-size: clamp(16px, 1.9vw, 21px); cursor: pointer;
      }
      /* The cursor is a bar and a colour, not a slab. Sakura for chrome.
         Amber stays on the flight instruments, where it has to punch through
         whatever the camera is looking at. */
      .row.on {
        color: var(--cream); border-left-color: var(--sakura);
        background: linear-gradient(90deg, rgba(232, 168, 184, 0.12), rgba(232, 168, 184, 0) 48%);
      }
      .row-info { cursor: default; }
      .row-grey {
        color: rgba(157, 179, 200, 0.62);
        cursor: default;
      }
      .row-grey .row-value, .row-grey .drop-btn { color: var(--slate); opacity: 0.85; }
      .row-grey.on {
        color: rgba(157, 179, 200, 0.92);
        border-left-color: rgba(157, 179, 200, 0.55);
        background: linear-gradient(90deg, rgba(157, 179, 200, 0.10), rgba(157, 179, 200, 0) 48%);
      }
      /*
       * The one thing to press.
       *
       * Every row on every screen used to be the same size, weight and
       * colour, so Fly and Credits were typographic equals and the only
       * hierarchy was a 4 px cursor bar. Mint on dark ink is the treatment
       * the track builder already gives Fly this track, and the rule the
       * builder's own comments state is one green button per screen, so
       * there is exactly one of these in any list.
       */
      .row-primary {
        margin: 4px 10px 8px;
        padding: 12px 18px;
        border-radius: 3px;
        border-left: 0;
        background: var(--mint);
        color: var(--deep);
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .row-primary .row-label { font-weight: 700; }
      .row-primary.on {
        border-left: 0;
        background: #a3ffca;
        color: var(--deep);
        box-shadow: 0 0 0 2px rgba(243, 234, 212, 0.55);
      }
      .row-primary.on .row-label { color: var(--deep); }

      /* A group heading in a long settings list. Not a row: no cursor, no
         hover, no click. Twenty flat rows in one scroll is a list you read
         rather than a panel you operate. */
      .menu-section {
        margin: 14px 0 2px;
        padding: 0 22px 5px 28px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--sakura);
        border-bottom: 1px solid rgba(232, 168, 184, 0.22);
        pointer-events: none;
      }
      .menu-scroll > .menu-section:first-child { margin-top: 4px; }

      /*
       * Rates. The one flight setting a pilot actually sets by hand, so it
       * gets a screen and a picture rather than a row buried in a list.
       *
       * House palette, not the Betaflight Configurator yellow that used to
       * live here. The flight-controller screen this replaces painted itself
       * #ffbb00 on #4d4d4d as a homage to Configurator 10.10, which was
       * honest about where its several hundred editable firmware keys came
       * from. There are five knobs now, they are ours, and they look it.
       */
      .screen-rates { justify-content: center; }
      .rates-lede {
        max-width: 48em; margin: 0 auto;
        color: rgba(235, 230, 215, 0.78);
        font-size: 15px; line-height: 1.6; text-align: center;
      }
      /*
       * Column one of .menu-stage, the seat the quad takes on Settings.
       *
       * width is pinned to 100% rather than inherited, because the shared
       * rule is `min(1600px, 98vw)` and .screen already spends 6vw a side on
       * padding. At 1440 that is a stage 143 px wider than the box holding
       * it, centred, so the curve hung 70 px off the left of the window.
       * 100% is the padded content box, which is what the stage meant.
       */
      .screen-rates .menu-stage {
        width: 100%;
        max-width: 1600px;
        grid-template-columns: minmax(320px, 1.5fr) auto minmax(0, 0.7fr);
      }
      .rates-panel {
        grid-column: 1;
        justify-self: end;
        align-self: center;
        display: flex; flex-direction: column;
        width: min(100%, 620px);
        margin-right: 18px;
        pointer-events: none;
      }
      /* Same well the menu block sits in, so the two panels read as one
         surface over a bright world rather than two different glasses. */
      .rates-graph-wrap {
        height: clamp(180px, 26vh, 260px);
        border-radius: 4px;
        background: rgba(16, 22, 17, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        overflow: hidden;
      }
      .rates-graph { display: block; width: 100%; height: 100%; }
      .rates-legend {
        display: flex; gap: 20px; flex-wrap: wrap;
        margin-top: 10px;
      }
      .rates-key { display: flex; align-items: baseline; gap: 7px; }
      .rates-key-dot {
        width: 9px; height: 9px; border-radius: 50%;
        align-self: center;
      }
      /* The dashed curve's key: a rule with gaps in it, not a dot, cut with
         a mask so it takes the same inline background colour as the dot. */
      .rates-key-dash {
        width: 18px; height: 2px; border-radius: 0;
        -webkit-mask-image: repeating-linear-gradient(to right, #000 0 5px, transparent 5px 9px);
        mask-image: repeating-linear-gradient(to right, #000 0 5px, transparent 5px 9px);
      }
      .rates-key-lab {
        font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
        color: rgba(235, 230, 215, 0.66);
      }
      .rates-key-val { font-size: 13px; font-weight: 650; color: var(--cream); }
      /* Four small facts under the curve. auto-fit rather than a fixed four
         columns, because this sits in a grid column whose width is a share
         of the window: at 1366 that column is 451 px, four columns of it are
         113 px each, and "19.5% stick" is wider than that, so the last cell
         used to spill out from under the curve and across the menu beside
         it. A track floor of 126 px wraps instead of overflowing, and is the
         widest floor that still fits all four across at 1600. */
      .rates-readout {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
        gap: 10px 14px; margin: 14px 0 0;
      }
      .rates-cell { min-width: 0; }
      .rates-readout dt {
        font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
        color: rgba(157, 179, 200, 0.85);
      }
      .rates-readout dd {
        margin: 3px 0 0; font-size: 14px; font-weight: 650;
        color: var(--cream); white-space: nowrap;
      }
      /* Same two colours as the curves, so a split reading needs no key. */
      .rates-num-rp { color: var(--sakura); }
      .rates-num-yaw { color: var(--slate); }
      .rates-num-sep, .rates-num-unit { color: rgba(235, 230, 215, 0.6); font-weight: 500; }
      .rates-num-sep[hidden], .rates-num-yaw[hidden] { display: none; }
      .screen-rates .menu-scroll { max-height: min(52vh, 30em); }
      .row-label { min-width: 0; flex: 1 1 auto; }
      .row.on .row-label { font-weight: 650; }
      .row-value {
        color: var(--sakura); font-size: 0.86em; font-weight: 600;
        letter-spacing: 0.03em; flex: 0 1 auto; min-width: 0;
        max-width: 52%; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; text-align: right;
      }
      .row-control {
        display: flex; align-items: center; gap: 8px; flex: 0 1 auto; min-width: 0;
      }
      .step-col {
        display: inline-flex; flex-direction: column; gap: 2px;
      }
      .step {
        width: 1.35em; height: 1.05em; padding: 0; border: 0; border-radius: 3px;
        background: rgba(232, 168, 184, 0.16); color: var(--sakura); cursor: pointer;
        font-size: 9px; line-height: 1; display: grid; place-items: center;
      }
      .step:hover { background: rgba(232, 168, 184, 0.32); }
      .drop-btn {
        appearance: none; border: 0; background: transparent;
        color: var(--sakura); font: inherit; font-size: 0.86em;
        cursor: pointer; padding: 2px 2px 2px 8px;
        display: inline-flex; align-items: center; gap: 8px;
        max-width: 100%; text-align: right; line-height: 1.25;
      }
      .drop-btn::after {
        content: ""; width: 0; height: 0; flex: 0 0 auto;
        border-left: 4px solid transparent; border-right: 4px solid transparent;
        border-top: 5px solid var(--sakura); opacity: 0.85;
      }
      .drop-list {
        position: fixed; z-index: 20; pointer-events: auto;
        max-height: min(280px, 46vh); overflow-y: auto;
        padding: 6px 0; border-radius: 4px;
        background: rgba(16, 22, 17, 0.97);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.28), 0 14px 32px rgba(0, 0, 0, 0.55);
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .drop-opt {
        display: block; width: 100%; box-sizing: border-box;
        border: 0; background: transparent; color: rgba(238, 232, 216, 0.78);
        font: inherit; font-size: 15px; text-align: left;
        padding: 7px 16px; cursor: pointer;
      }
      .drop-opt:hover, .drop-opt.on { color: var(--cream); background: rgba(232, 168, 184, 0.12); }
      /* A narrow window stacks the curve over the rows rather than
         squeezing both. Same breakpoint the rest of the page uses. */
      /* One column: the curve stacks over the rows rather than squeezing
         both, and the note moves under the list where there is width for
         it. Everything shrinks a little, because a window this size has to
         hold the curve, seven rows and the hint at once. */
      @media (max-width: 1100px) {
        .screen-rates .menu-stage { grid-template-columns: minmax(0, 1fr); }
        .rates-panel {
          grid-column: 1; grid-row: 1;
          justify-self: center; width: min(100%, 620px); margin: 0 0 12px;
        }
        .screen-rates .menu-stage .menu { grid-column: 1; justify-self: center; }
        .screen-rates .menu-help {
          grid-column: 1; max-width: none; border-left: 0;
          padding: 8px 14px 0; margin-top: 6px; text-align: center;
        }
        .rates-graph-wrap { height: clamp(140px, 20vh, 200px); }
        .screen-rates .menu-scroll { max-height: 34vh; }
        /* The note moved under the list in this layout, so the hint no
           longer needs the full gap: at 900 by 760 the longest note pushed
           it three pixels below the fold. */
        .screen-rates .hint { margin-top: 12px; }
        /* Narrow enough to clear the music dock and the bug chip, which are
           fixed to the top right corner and sit over any screen. At 48em the
           last words of this sentence went under them. */
        .rates-lede { max-width: 34em; }
      }
      /* A short window spends its height on the curve and the rows: the
         lede is the one thing here that repeats what the row notes say, and
         the curve gives up the pixels the list needs to show all seven rows
         rather than six and a half. */
      @media (max-height: 820px) {
        .rates-graph-wrap { height: clamp(118px, 16vh, 160px); }
        .screen-rates .menu-scroll { max-height: 46vh; }
      }
      /* Shorter still, and the lede is the first thing to go: it is the one
         line here that the row notes already say in more detail. */
      @media (max-height: 700px) {
        .rates-lede { display: none; }
        /* A 1024 by 700 window is 14 px short with the lede already gone and
           the longest note showing, so the curve gives up those pixels. It
           is a shape, not a table: it survives being short far better than
           the rows survive being cut. */
        .rates-graph-wrap { height: clamp(100px, 14vh, 140px); }
        .screen-rates .hint { margin-top: 8px; }
      }
      .hint {
        display: flex; align-items: center; gap: 12px;
        margin-top: 22px; min-height: 1.4em; max-width: 42em;
        font-size: 13px; color: rgba(235, 230, 215, 0.6); letter-spacing: 0.02em; text-align: center;
        pointer-events: none;
      }
      .screen-modal .hint {
        margin-left: auto;
        margin-right: auto;
        color: rgba(235, 230, 215, 0.8);
      }
      .title-foot .hint {
        margin-top: 0; text-align: left; max-width: none;
      }
      .hint-keys { display: inline-flex; gap: 4px; flex: 0 0 auto; }
      .hint kbd {
        font-family: inherit; font-size: 11px; font-weight: 650;
        padding: 2px 7px; border-radius: 3px;
        border: 1px solid rgba(235, 230, 215, 0.35);

      }
      .screen-calibrate {
        pointer-events: auto;
      }

      }
      .cal-prompt {
        margin: 0; max-width: 28em; text-align: center;

      .cal-actions { display: flex; gap: 10px; margin-top: 4px; }

      .screen-padpick {

      .pad-cards {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 16px; margin: 28px 0 18px; max-width: 1100px;
      }
      .pad-card {
        width: 220px;
        padding: 14px 14px 12px;

      }
      .pad-card.is-on {

      }

        color: var(--sakura); margin-bottom: 10px;

      .pad-card-art {

        margin-bottom: 10px;
      }
      .pad-card .osd-gimbal-plate {

        background: rgba(12, 18, 14, 0.55);
      }

      .pad-card-name {
        font-size: 13px; color: var(--cream);
        min-height: 2.4em; line-height: 1.3;
      }
      .pad-card-status {
        margin-top: 4px; font-size: 12px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--slate);
      }
      .pad-card.is-live .pad-card-status { color: var(--amber); }
      .pad-card.is-on .pad-card-status { color: var(--mint); }
      .pad-actions { flex-wrap: wrap; justify-content: center; }
      @media (max-width: 860px) {
        .menu-stage {
          display: flex; flex-direction: column; align-items: stretch;
          position: relative;
          width: min(540px, 90vw);
        }

            linear-gradient(180deg, rgba(12, 18, 14, 0.70) 0%, rgba(12, 18, 14, 0.18) 16%, rgba(12, 18, 14, 0.04) 38%, rgba(12, 18, 14, 0.12) 58%, rgba(12, 18, 14, 0.84) 100%);
        }

        }

          width: 100%;
        }
        .screen-title .menu-scroll {
          max-height: min(32vh, 14em);
        }
        .screen-title .menu-help {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 100%;
          width: auto;
          max-width: none;
          text-align: left;
          border: none;
          padding: 0 4px 10px;
        }
        .screen-maps .menu-stage {
          display: block;
          position: relative;
          width: min(540px, 90vw);
        }
        .screen-maps .menu { grid-column: auto; }
        .howto-body { gap: 18px; }
        .howto-keys { min-width: 0; }
        .screen-maps .menu-help {
          position: absolute;
          left: 0; right: 0;
          bottom: calc(100% + 8px);
          margin: 0;
          padding: 0 8px 8px;
          border-left: none;
        }

        .craft-showcase {

      @media (max-height: 520px) {

        }
        .screen-title .brand-sub,
        .screen-title .brand-best,
        .screen-title .keep-note,
        .screen-title .title-foot .hint {

        }

      /* The map screen. One card per world, each playing a short flight
         through it. The cursor is the same bar and colour the menu rows
         use, turned on its side: a sakura edge and a lift, never a slab. */
      /* Symmetric, so the row list sits under the middle of the card grid
         rather than pushed right by a help column with no counterweight. */
      .screen-maps .menu-stage {
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        width: min(1200px, 96vw);
        margin: 10px auto 0;
      }
      .screen-maps .menu { grid-column: 2; min-width: min(320px, 86vw); }
      .screen-maps .menu-help { grid-column: 3; max-width: 22em; }
      .screen-courses .menu-scroll { max-height: none; }
      .map-cards {
        display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
        margin: 18px 0 10px; pointer-events: auto;
        width: 100%;
      }
      .map-card {
        width: min(340px, 82vw); cursor: pointer; border-radius: 4px;
        overflow: hidden; position: relative;
        background: rgba(16, 22, 17, 0.72);
        border-top: 2px solid rgba(232, 168, 184, 0.28);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      }
      .map-card.on {
        transform: translateY(-4px);
        border-top-color: var(--sakura);
        box-shadow: inset 0 0 0 2px var(--sakura), 0 12px 28px rgba(0, 0, 0, 0.45);
      }
      /* The card whose actions are showing below the strip. It has to read as
         chosen even when the cursor has moved off it onto its own list, which
         is the whole reason the list is not floating free any more. Mint
         rather than sakura: sakura is the cursor, and two pinks a card apart
         would be one state drawn twice. */
      .map-card.chosen {
        border-top-color: var(--mint);
        box-shadow: inset 0 0 0 2px var(--mint), 0 12px 28px rgba(0, 0, 0, 0.45);
      }
      .map-card.chosen.on {
        box-shadow: inset 0 0 0 2px var(--sakura), 0 0 0 3px var(--mint),
          0 12px 28px rgba(0, 0, 0, 0.45);
      }
      .map-card.chosen .map-card-name { color: var(--mint); }
      /* 16 by 9, so the thumbnail is the shape of the thing it is a
         thumbnail of. A looping clip of the title shot fills this box. */
      .map-reel {
        display: block; width: 100%; aspect-ratio: 16 / 9; background: #1a241c;
        position: relative; overflow: hidden;
      }
      .map-reel-view {
        position: absolute; inset: 0; width: 100%; height: 100%;
        border: 0; display: block; object-fit: cover; pointer-events: none;
        z-index: 0;
      }
      .map-card-still {
        position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 16 / 9;
        display: flex; align-items: center; justify-content: center;
        padding: 0 18px; box-sizing: border-box; text-align: center;
        color: var(--slate); font-size: 13px; line-height: 1.5;
      }
      .map-card-still:empty { display: none; }
      /* First-time clip wait. Same copy as the boot screen: "loading"
         and a joke. Cached visits never see it. */
      .map-reel-wait {
        position: absolute; inset: 0; z-index: 2;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 8px;
        padding: 12px 16px;
        box-sizing: border-box;
        text-align: center;
        background: radial-gradient(120% 90% at 50% 42%, #1e2a20, #101610);
        pointer-events: none;
      }
      .map-reel-wait-stage {
        font-size: 13px; letter-spacing: 0.06em; color: var(--cream);
      }
      .map-reel-wait-joke {
        font-size: 12px; line-height: 1.4; font-style: italic;
        color: var(--slate); max-width: 22em; min-height: 2.8em;
      }
      .map-card-body {
        display: flex; align-items: baseline; gap: 10px;
        padding: 10px 14px 12px;
      }
      .map-card-name { color: var(--cream); font-size: 17px; font-weight: 600; }
      .map-card.on .map-card-name { color: var(--sakura); }
      .map-card-tag {
        margin-left: auto; color: var(--mint); font-size: 11px;
        letter-spacing: 0.1em; text-transform: uppercase;
      }

      /*
       * The Courses screen. Worlds in one strip, courses in another, and
       * the courses are DRAWN: same plan the board and the builder draw,
       * from src/share/plan.js. This screen replaced three (Choose map,
       * Custom map, Create / edit map), each of which asked the player to
       * choose before showing them anything to choose between.
       */
      /* The PAGE scrolls, not a box inside it. Two card strips and seven
         rows do not fit a 900 px window, and a nested scroller inside a
         screen that is already too tall is two scrollbars arguing. The
         cursor's scrollIntoView drives this one. */
      .screen-courses {
        justify-content: flex-start;
        padding-top: 4vh;
        padding-bottom: 3vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        pointer-events: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .screen-courses > * { flex: 0 0 auto; }
      .card-strip { width: 100%; margin-bottom: 6px; }
      .strip-label {
        margin: 10px 0 2px;
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase;

      .course-card .map-reel { background: #0b1119; }
      .course-card canvas.plan {
        position: absolute; inset: 0;
        display: block; width: 100%; height: 100%;

      .map-card-meta {

      .map-card-meta:empty { display: none; }

      /* The one badge, in the one vocabulary the builder and the board also
         use. See courseChip in src/share/listing.js: the label is decided
         there so the same course cannot be described two ways. */
      .course-chip {
        position: absolute; left: 10px; top: 10px; z-index: 3;
        padding: 3px 9px; border-radius: 999px;
        font-size: 10px; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase;
        background: rgba(11, 17, 25, 0.86);
        color: var(--slate);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.35);
        max-width: calc(100% - 20px);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .course-chip.tone-live {
        color: var(--mint);
        box-shadow: inset 0 0 0 1px rgba(125, 255, 180, 0.45);
      }
      .course-chip.tone-warn {
        color: var(--amber);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.5);
      }
      .board-note {
        width: 100%; margin: 4px 0 0; text-align: center;
        color: var(--slate); font-size: 13px;
      }
      .board-note:empty { display: none; }

      /*
       * How to fly. A CONTROL, NOT AN ESSAY.
       *
       * This screen was two definition lists over a two hundred word centred
       * paragraph, and the product already owned the thing that teaches a
       * stick: the gimbal pair the flight overlay and the calibration screen
       * both draw. So the sticks here are live, fed the same channels as the
       * quad, and the prose is cut to what a picture cannot say. One source
       * at a time: a keyboard pilot does not need the radio's five lines.
       */
      .howto-lede {
        max-width: 46em; margin: 0 0 18px;
        color: rgba(235, 230, 215, 0.78);
        font-size: 15px; line-height: 1.6; text-align: center;
      }
      .howto-tabs { display: flex; gap: 8px; pointer-events: auto; }
      .howto-tab {
        appearance: none; border: 0; border-radius: 3px;
        background: rgba(16, 22, 17, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.14);
        color: rgba(238, 232, 216, 0.72);
        font: inherit; font-size: 13px; font-weight: 650;
        letter-spacing: 0.1em; text-transform: uppercase;
        padding: 7px 16px; cursor: pointer;
      }
      .howto-tab:hover { color: var(--cream); }
      .howto-tab.on {
        background: rgba(232, 168, 184, 0.16);
        box-shadow: inset 0 0 0 1px var(--sakura);
        color: var(--cream);
      }
      .howto-body {
        display: flex; align-items: center; justify-content: center;
        gap: clamp(24px, 5vw, 64px); flex-wrap: wrap;
        margin: 22px 0 4px;
      }
      .howto-rig { display: flex; flex-direction: column; align-items: center; }
      .howto-sticks { display: flex; gap: 28px; align-items: flex-end; }
      .screen-howto .osd-gimbal-plate {
        width: clamp(96px, 12vw, 132px);
        height: clamp(96px, 12vw, 132px);
        background: rgba(12, 18, 14, 0.55);
      }
      .howto-live {
        margin-top: 12px; font-size: 12px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--amber); text-align: center;
      }
      .howto-keys { margin: 0; max-width: 34em; min-width: min(100%, 22em); }
      .howto-keys dt { color: var(--cream); font-size: 15px; font-weight: 600; margin-top: 12px; }
      .howto-keys dt:first-child { margin-top: 0; }
      .howto-keys dd { margin: 2px 0 0; color: var(--slate); font-size: 14px; line-height: 1.5; }
      .howto-mode {
        max-width: 52em; margin: 20px auto 0;
        color: rgba(235, 230, 215, 0.62);
        font-size: 13.5px; line-height: 1.6; text-align: center;
      }

      .cols { display: flex; gap: 6vw; flex-wrap: wrap; justify-content: center; }
      .col { max-width: 30em; }
      .col dl { margin: 0; }
      .col dt { color: var(--cream); font-size: 15px; font-weight: 600; margin-top: 12px; }
      .col dd { margin: 2px 0 0; color: var(--slate); font-size: 14px; line-height: 1.5; }
      .lede {
        max-width: 58em; margin: 24px auto 0; color: var(--slate);
        font-size: 15px; line-height: 1.65; text-align: center;
      }

      /* Credits. A racing programme over the live world, not a second
         landscape. Logos sit in a well; cream type; sakura kickers. */
      .screen-credits {
        justify-content: flex-start;
        align-items: stretch;
        overflow-y: auto;
        overscroll-behavior: contain;
        pointer-events: auto;
        padding: 5vh 4vw 4vh;
      }
      .screen-credits h2 {
        align-self: center;
        margin-bottom: 8px;
      }
      .screen-credits h2::after {
        content: "";
        display: block;
        width: 36px; height: 2px;
        background: var(--sakura);
        margin: 10px auto 0;
      }
      .credits-roll {
        width: min(720px, 94vw);
        margin: 0 auto;
        pointer-events: auto;
      }
      .credits-lede {
        margin: 10px 0 22px;
        color: var(--slate);
        font-size: 15px;
        line-height: 1.6;
        text-align: center;
      }
      .credit-block { margin: 0 0 22px; }
      .credit-kicker {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--sakura);
        margin-bottom: 8px;
      }
      .credit-block h3 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: none;
        color: var(--cream);
      }
      .credit {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 16px 16px;
        margin-bottom: 10px;
        background: rgba(16, 22, 17, 0.72);
        border-radius: 4px;
        border-top: 2px solid rgba(232, 168, 184, 0.28);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
      }
      .credit-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      @media (min-width: 640px) {
        .credit-row.pair { grid-template-columns: 1fr 1fr; }
        .credit-row.pilots { grid-template-columns: 1fr 1fr 1fr; }
      }
      @media (max-width: 639px) {
        .credit-row.pilots { grid-template-columns: 1fr; }
      }
      .credit-logo {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        min-height: 44px;
      }
      .credit-logo img, .credit-logo svg {
        display: block;
        height: 40px;
        width: auto;
        max-width: min(100%, 280px);

      }
      .credit-logo.light {

        border-radius: 4px;
        padding: 10px 14px;
        min-height: 0;
      }
      .credit-logo.light img, .credit-logo.light svg { height: 32px; }
      .credit-logo-fallback {
        color: var(--cream);
        font-size: 14px;
        font-weight: 700;
      }
      .credit-logo.plate {
        min-height: 0;
      }
      .maker-mark {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: var(--cream);
        line-height: 1;
        text-shadow: 2px 2px 0 rgba(20, 28, 20, 0.82);
      }
      .maker-mark .fpv { color: var(--sakura); }
      .pilot-chip {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 4px;
        background: rgba(12, 18, 14, 0.55);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.45);
        color: var(--sakura);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .credit-copy h4 {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--cream);
      }
      .credit-copy p {
        margin: 0;
        color: var(--slate);
        font-size: 14px;
        line-height: 1.55;
      }
      .credit-copy a, .credits-legal a {
        color: var(--sakura);

      }
      .credit-copy a:hover, .credits-legal a:hover { color: var(--cream); }
      .credits-legal {

      .screen-credits .menu-stage {

      }
      .screen-credits .menu {

      .screen-modal { background: rgba(12, 18, 14, 0.72); }

      /* Finish. Same HUD hole as the title: the frozen craft and the
         course sit in the open side, the times own the left (or the
         bottom on a phone). */
      .screen-results {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: stretch;
        width: 100%;
        height: 100%;
        padding: 4.5vh 4vw 3vh;
        background:
          linear-gradient(90deg, rgba(12, 18, 14, 0.84) 0%, rgba(12, 18, 14, 0.50) 28%, rgba(12, 18, 14, 0.10) 54%, rgba(12, 18, 14, 0.12) 100%),
          linear-gradient(180deg, rgba(12, 18, 14, 0.28) 0%, transparent 22%, transparent 64%, rgba(12, 18, 14, 0.40) 100%);
      }
      .results-copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;

        height: 100%;
        min-width: 0;
        min-height: 0;

      .results-top { min-height: 0; }
      .results-kicker {
        display: flex; align-items: center; gap: 12px;
        font-size: clamp(13px, 1.4vw, 16px); color: #d8d2c0;
        letter-spacing: 0.28em; text-transform: uppercase;

      .results-kicker:empty { display: none; }
      .results-kicker::before {

      .screen-results .results-head {

      .results-hero-cap {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;

      }
      .results-hero-time {
        margin-top: 2px;
        font-size: clamp(56px, 9vw, 112px); font-weight: 800;
        letter-spacing: 0.02em; line-height: 0.92; color: var(--cream);
        text-shadow: 3px 3px 0 rgba(20, 28, 20, 0.82), 0 10px 28px rgba(0, 0, 0, 0.32);
      }
      .screen-results.is-record .results-hero-time {

      }
      .results-hero-meta {

      .results {
        min-width: 0; width: 100%;
        margin: 18px 0 0;
        max-height: min(32vh, 16em);
        overflow-y: auto;

        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .results-empty {
        margin: 0; color: var(--slate); font-size: 15px; line-height: 1.55;

      }
      .result-row {
        padding: 8px 0 10px;
        border-bottom: 1px solid rgba(244, 236, 214, 0.12);
      }
      .result-main {

      }
      .result-label { color: var(--slate); min-width: 4.6em; }
      .result-time { color: var(--cream); font-weight: 600; margin-left: auto; }
      .result-tag { color: var(--mint); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
      .result-row.void .result-time { color: #93a7ba; font-weight: 400; }
      .result-why { color: #7f95ab; font-size: 12px; letter-spacing: 0.06em; max-width: 16em; }
      .result-row.total { border-bottom: none; margin-top: 4px; }
      .result-row.total .result-time { color: var(--sakura); }
      .result-bar {
        height: 3px; margin-top: 7px; border-radius: 2px;

        overflow: hidden;

      /* The course the lap was flown on. Same drawing as the Courses cards
         and the public board, from src/share/plan.js. */
      .results-plan {
        margin: 14px 0 0;
        width: min(100%, 26em);
        border-radius: 4px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
      }
      .results-plan[hidden] { display: none; }
      .results-plan canvas.plan {

        aspect-ratio: 16 / 9;
      }
      @media (max-height: 720px) { .results-plan { display: none; } }
      .results-note {
        margin: 14px 0 0; color: rgba(235, 230, 215, 0.72);
        font-size: 13.5px; line-height: 1.55; max-width: 34em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .results-note:empty { display: none; }
      .results-foot {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-end;
        gap: 14px;
        width: 100%;
        margin-top: auto;

      .screen-results .menu-stage {
        display: block;
        position: static;
        width: 100%;
        margin-top: 0;
        flex: 0 0 auto;

      .screen-results .menu-help {

        left: 0; right: 0; bottom: 100%;

      @media (max-width: 860px) {

            linear-gradient(180deg, rgba(12, 18, 14, 0.28) 0%, rgba(12, 18, 14, 0.08) 18%, rgba(12, 18, 14, 0.10) 42%, rgba(12, 18, 14, 0.88) 100%);

      /* Loading. This markup is STATIC, and that is the point: it paints on
         the first layout, before the import map has resolved a single module,
         so the three.js fetch is a stage the player can see rather than a
         blank page. src/ui/loading.js only ever writes into it. */
      #loading {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: radial-gradient(120% 90% at 50% 42%, #1e2a20, #101610);
        font-family: var(--ui-font); color: var(--cream);
        font-variant-numeric: tabular-nums;
        transition: opacity 0.3s ease;
      }
      #loading[hidden] { display: none; }
      .loading-stage {
        font-size: clamp(18px, 2.4vw, 22px); letter-spacing: 0.06em;
        color: var(--cream);
      }
      .loading-joke {
        margin-top: 12px; font-size: 15px; line-height: 1.45;
        font-style: italic; color: var(--slate);
        max-width: 28em; min-height: 2.2em; text-align: center;
      }
      .loading-joke.is-error {
        font-style: normal; color: #ff8f8f;
      }
      .loading-track {
        width: min(420px, 68vw); height: 5px; border-radius: 3px;
        margin-top: 28px;
        background: rgba(16, 22, 17, 0.8);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.28);
        overflow: hidden;
      }
      .loading-fill {
        height: 100%; width: 0%; background: var(--sakura);
        transition: width 0.15s linear;
      }

      .name-dialog {
        position: absolute; inset: 0; z-index: 8;
        display: flex; align-items: center; justify-content: center;
        background: rgba(12, 18, 14, 0.72);
        pointer-events: auto;
        user-select: text;
      }
      .name-dialog[hidden] { display: none; }
      .name-dialog-box {
        width: min(420px, 86vw); padding: 22px 24px 20px;
        background: var(--panel); border-radius: 4px;
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.35), 0 18px 40px rgba(0, 0, 0, 0.55);
      }
      .name-dialog-box.bug {
        width: min(520px, 92vw);
        max-height: min(88vh, 740px);
        overflow-y: auto;
      }
      .name-dialog-box h2 {
        margin: 0 0 10px; font-size: 22px; color: var(--cream);
      }
      .name-dialog-box .lede {
        margin: 0 0 10px; text-align: left; max-width: none; font-size: 14px;
      }
      .name-dialog-label {
        margin: 12px 0 0; font-size: 11px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--slate);
      }
      .name-dialog-input {
        display: block; width: 100%; box-sizing: border-box;
        margin: 8px 0 4px; padding: 9px 11px;
        background: #121a14; border: 1px solid rgba(244, 236, 214, 0.16);
        border-radius: 4px; color: var(--cream); font: inherit; font-size: 16px;
      }
      .name-dialog-area { min-height: 4.5em; resize: vertical; }
      .name-dialog-input:focus {
        outline: none; border-color: var(--sakura);
      }
      .name-dialog-err {
        min-height: 1.3em; margin: 0 0 10px; color: #ff8f8f; font-size: 12px;
      }
      .name-dialog-row { display: flex; gap: 8px; }
      .name-dialog-btn {
        appearance: none; border: 1px solid rgba(244, 236, 214, 0.16);
        background: #121a14; color: var(--slate); font: inherit;
        padding: 7px 14px; border-radius: 4px; cursor: pointer;
      }
      .name-dialog-btn.on {
        background: var(--mint); border-color: var(--mint);
        color: var(--deep); font-weight: 600;
      }
      .name-dialog-btn:disabled { opacity: 0.45; cursor: default; }
      .bug-chip {
        position: absolute; top: 16px; right: 16px; z-index: 7;
        pointer-events: auto;
        appearance: none; border: 1px solid rgba(232, 168, 184, 0.45);
        background: rgba(16, 22, 17, 0.82); color: var(--cream);
        font: 600 12px/1 var(--ui-font); letter-spacing: 0.06em;
        padding: 8px 12px; border-radius: 4px; cursor: pointer;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      }
      /* Live flight: same corner, a shade quieter so the FPV frame still
         reads, still a real button. Click pauses, then opens the form. */
      .bug-chip.on-flight {
        background: rgba(16, 22, 17, 0.55);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }
      .bug-chip:hover { border-color: var(--sakura); color: var(--sakura); }
      .bug-chip[hidden] { display: none; }

      /* Music skip. Tiny, out of the FPV instruments. Menus park it under
         the bug chip at the top right, over the open world rather than
         over the list. Flight puts it top left, away from the timer, the
         pack, and the bug chip. Buttons never take focus, so a click
         cannot steal Space from throttle. */
      .music-dock {
        position: absolute; right: 16px; top: 52px; z-index: 6;
        display: flex; align-items: center; gap: 4px;
        pointer-events: auto;
        padding: 3px 6px 3px 3px; border-radius: 4px;
        background: rgba(16, 22, 17, 0.50);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.16);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }
      .music-dock.on-flight {
        right: auto; left: 16px; top: 16px;
        background: rgba(16, 22, 17, 0.38);
      }
      .music-dock.is-muted { opacity: 0.5; }
      .music-dock[hidden] { display: none; }
      .music-skip {
        appearance: none; border: 0; border-radius: 3px;
        width: 26px; height: 24px; padding: 0;
        background: rgba(232, 168, 184, 0.14); color: var(--cream);
        font: 700 16px/1 var(--ui-font); cursor: pointer;
      }
      .music-skip:hover { background: rgba(232, 168, 184, 0.32); color: var(--sakura); }
      .music-title {
        max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-size: 11px; letter-spacing: 0.04em; color: var(--cream);
      }
      @media (max-width: 520px) {
        .music-title { max-width: 6.5em; font-size: 10px; }
      }

      /* The target mark. A bracket on the next gate while it is in frame,
         a chevron pinned inside the edge while it is not, and the range
         under either. Green while the pilot is on the side the gate is
         flown from, red while they are not, which is the same half space
         the gate itself is coloured by: the display and the world must
         never disagree about which way through.

         currentColor everywhere, so the side is one class on the root and
         not four colour writes a frame. Transform only, no width or top,
         so tracking a gate at 30 m/s costs a composite and not a layout. */
      .lock {
        position: absolute; left: 0; top: 0; pointer-events: none;
        color: #39ff8b;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.9));
        will-change: transform;
      }
      .lock.is-off { display: none; }
      .lock.is-wrong { color: #ff5a5a; }
      .lock-box {
        position: absolute; left: 0; top: 0;
        transform: translate(-50%, -50%);
      }
      .lock.is-edge .lock-box { display: none; }
      /* Corner ticks, not a closed rectangle. A box drawn round an opening
         reads as a second gate; four ticks read as an instrument. */
      .lock-box .lc {
        position: absolute; width: 24%; height: 24%;
        border: 2px solid currentColor;
      }
      .lock-box .lc.tl { left: 0; top: 0; border-right: 0; border-bottom: 0; }
      .lock-box .lc.tr { right: 0; top: 0; border-left: 0; border-bottom: 0; }
      .lock-box .lc.bl { left: 0; bottom: 0; border-right: 0; border-top: 0; }
      .lock-box .lc.br { right: 0; bottom: 0; border-left: 0; border-top: 0; }
      /* The chevron is the state where the pilot cannot see the target at
         all, so it is the loudest thing this mark ever draws: bigger than
         the bracket's ticks, and breathing, because a still triangle on the
         edge of a moving frame is a thing the eye stops reporting. */
      .lock-arrow {
        position: absolute; left: 0; top: 0; display: none;
        width: 0; height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-bottom: 27px solid currentColor;
        transform-origin: 50% 50%;
      }
      .lock.is-edge .lock-arrow { display: block; }
      /* Shallow on purpose. Deep enough to catch the eye at the edge of the
         frame, never so deep that the chevron is missing from a frame: a
         marker that is sometimes absent is a marker a pilot learns to
         distrust, and a capture of one is evidence of nothing. */
      .lock.is-edge { animation: lock-hunt 1.15s ease-in-out infinite; }
      @keyframes lock-hunt {
        50% { opacity: 0.72; }
      }
      .lock-dist {
        position: absolute; left: 0; top: 0;
        font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
        color: currentColor; white-space: nowrap;
      }
    </style>
    <!-- Three.js only, pinned. The addons path is the same package, used
         for the post processing chain; nothing else is on the render
         side. See PROGRESS.md. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="loading-stage">loading</div>
      <div class="loading-joke">"I complimented my quad on its propellers. It said thanks for the props."</div>
      <div class="loading-track"><div class="loading-fill"></div></div>
    </div>
    <!-- boot.js, not main.js. It imports nothing at module scope except the
         loading screen, so the screen is alive and reporting BEFORE the
         three.js fetch begins. main.js imports three statically and is itself
         one of boot's stages. -->
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
