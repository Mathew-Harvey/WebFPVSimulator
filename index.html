<!doctype html>
<!--
  WebFPVSimulator: the page. A canvas for the world, an overlay for the
  product shell (title, how to fly, credits, settings, pause, results, and the
  flight display). The overlay's structure is built in src/ui/ui.js; its
  styling lives here with the rest of the page's CSS.

  Colour rule: light is warm, shadow is cool. Cream for lit type. Sakura
  for chrome (menus, the wordmark's FPV). Amber for instruments that have
  to read over live footage. Mint for a record. Recessed type stays a
  cool mist so it still recedes on grass and sky. The title and the
  finish screen do not paint a second landscape and do not load a
  webfont: the world behind the menu is the picture, and the overlay
  is CSS. Mint on the finish hero is a record.

  This file is part of WebFPVSimulator.

  WebFPVSimulator is free software: you can redistribute it and/or modify
  it under the terms of the GNU General Public License as published by
  the Free Software Foundation, either version 3 of the License, or (at
  your option) any later version.

  WebFPVSimulator is distributed in the hope that it will be useful, but
  WITHOUT ANY WARRANTY, without even the implied warranty of
  MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the GNU
  General Public License for more details.

  You should have received a copy of the GNU General Public License
  along with WebFPVSimulator. If not, see <https://www.gnu.org/licenses/>.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale and viewport-fit are for flight on a phone: a
         double-tap that zooms the page mid-race is a crash, and the thumb
         stick margins read the safe-area insets on notched screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>WebFPV, a browser FPV racing simulator</title>
    <meta name="description" content="Fly a five inch quad in a browser, on a real Betaflight control loop compiled to WebAssembly. Build a track, set a lap, put it on the public board." />
    <!--
      A link to this page posted anywhere renders a 1200 by 630 card, and
      og.png is a frame of the real shell rather than a drawing of one, so it
      cannot disagree with the thing it advertises. scripts/og.js in the
      simulator's repository regenerates it, and the URL is absolute because a
      crawler does not resolve a relative one.

      No animated card. Facebook, Messenger, X, LinkedIn, WhatsApp and iMessage
      all flatten a link preview to one still frame; Discord is the only place
      that would animate it, which is not worth a second asset.
    -->
    <link rel="canonical" href="https://webfpv.org/sim/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WebFPV" />
    <meta property="og:url" content="https://webfpv.org/sim/" />
    <meta property="og:title" content="WebFPV, fly a quad in your browser" />
    <meta property="og:description" content="A real Betaflight control loop compiled to WebAssembly, a race track, and a lap timer. Plug in a gamepad and go." />
    <meta property="og:image" content="https://webfpv.org/sim/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The WebFPV simulator: a lit start gate on mown grass, a five inch quad parked beside it, flags and track markers running away under a low sun." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WebFPV, fly a quad in your browser" />
    <meta name="twitter:description" content="A real Betaflight control loop compiled to WebAssembly, a race track, and a lap timer. Plug in a gamepad and go." />
    <meta name="twitter:image" content="https://webfpv.org/sim/og.png" />
    <meta name="twitter:image:alt" content="The WebFPV simulator: a lit start gate on mown grass, a five inch quad parked beside it, flags and track markers running away under a low sun." />

    <!--
      The mark is four propellers, an X frame and the stack in the middle, one
      shape shared by all four pages in the family with one accent each, so a
      pilot with the simulator, the builder and the board open at once can
      tell three tabs apart without reading them. This one is sakura, which is
      the colour of the FPV in the wordmark. scripts/icons.js draws them all.
    -->
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#141c16" />
    <style>
      :root {
        --cream: #f3ead4;
        --sakura: #e8a8b8;
        --amber: #ffd45c;
        --mint: #7dffb4;
        --slate: #9db3c8;
        --deep: #141c16;
        /*
         * THE FRAME'S TWO BARS, as tokens rather than as numbers typed into
         * seventeen places.
         *
         * Every scroller cap in this sheet is a hand tuned vh, and seven of
         * them say in their own comments which window they were measured
         * against. Adding a status bar and a command bar without telling
         * those caps about it puts the Rates screen 52 px under its own bar
         * at 1280x720, measured. So the caps subtract these, and a screen
         * that hides a bar sets its own value to zero rather than fighting
         * the cap.
         */
        --bar-top: 36px;
        --bar-bot: 44px;
        --bars: calc(var(--bar-top) + var(--bar-bot));
        --panel: #1a241c;
        --ink: rgba(12, 18, 14, 0.86);
        --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      /* overscroll-behavior is for phones: a drag that starts on the world
         must not become a pull-to-refresh mid-flight. */
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--deep); overscroll-behavior: none; }
      #view {
        display: block; position: fixed; inset: 0;
        width: 100%; height: 100%;
      }
      #ui {
        position: fixed; inset: 0; pointer-events: none; user-select: none;
        font-family: var(--ui-font); color: var(--cream);
        font-variant-numeric: tabular-nums;
      }

      /* Flight display. Thin warm type over a dark edge, the way an OSD
         reads over any background. */
      .osd { position: absolute; inset: 0; }
      .osd.dim { opacity: 0.4; }
      .osd-top {
        position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
        text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.85);
      }
      .osd-timer { font-size: 46px; font-weight: 600; letter-spacing: 0.02em; line-height: 1; }
      .osd-timer.waiting { color: #b9c9d8; }
      .osd-label {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--slate); margin-bottom: 2px;
      }
      .osd-value { font-size: 20px; font-weight: 600; }
      .osd-sub { font-size: 13px; color: var(--slate); margin-top: 1px; margin-bottom: 8px; }
      .osd-gate { font-size: 15px; color: var(--amber); margin-top: 6px; letter-spacing: 0.08em; text-transform: uppercase; }
      .osd-best { font-size: 14px; color: var(--slate); margin-top: 3px; }
      /* The gap to the ghost, lit for a moment after each gate. Mint when
         the pilot is ahead of it, amber when it is ahead, the same reading
         the rest of this overlay teaches: mint is the good news. */
      .osd-ghost { font-size: 15px; font-weight: 600; margin-top: 4px; letter-spacing: 0.04em; }
      .osd-ghost.is-off { display: none; }
      .osd-ghost.ahead { color: var(--mint); }
      .osd-ghost.behind { color: var(--amber); }
      .osd-corner {
        position: absolute; bottom: 20px; width: 190px;
        text-shadow: 0 2px 6px rgba(0,0,0,0.85); font-size: 15px;
      }
      .osd-left { left: 22px; }
      .osd-right { right: 22px; text-align: right; }
      .osd-mode { letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); }
      .osd-launch {
        position: absolute; left: 50%; top: 16%;
        transform: translate(-50%, 0);
        font-size: clamp(28px, 4.2vw, 46px); font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--amber);
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.92);
        pointer-events: none;
      }
      .osd-launch.is-off { display: none; }
      .osd-launch.is-hot { animation: launch-blink 0.32s step-end infinite; }
      .osd-launch.is-go {
        color: #8dffb0;
        letter-spacing: 0.32em;
        font-size: clamp(40px, 6vw, 64px);
      }
      @keyframes launch-blink {
        50% { opacity: 0.2; }
      }
      .bar {
        height: 5px; margin-top: 7px; border-radius: 3px;
        background: rgba(12, 22, 34, 0.65);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.35);
        overflow: hidden;
      }
      .bar-fill { height: 100%; width: 0%; background: var(--mint); transition: width 0.12s linear; }
      .bar-fill.warm { background: var(--amber); }
      .osd-hits { margin-top: 10px; margin-bottom: 0; }
      .osd-hits.warn { color: var(--amber); }


      /* Keyboard stick ghost. Two Mode 2 gimbals: left is yaw and
         throttle, right is roll and pitch. Shown only when the keyboard
         is the stick source, so a radio does not grow a second pair of
         sticks. Transparent enough to read a gate through. */
      .osd-sticks {
        position: absolute; left: 50%; bottom: 18px;
        transform: translateX(-50%);
        display: flex; align-items: flex-end; gap: 22px;
        pointer-events: none;
      }
      .osd-sticks.is-off { display: none; }
      .osd-gimbal-plate {
        position: relative;
        width: clamp(64px, 11vw, 88px);
        height: clamp(64px, 11vw, 88px);
        border-radius: 4px;
        background: rgba(12, 18, 14, 0.28);
        box-shadow: inset 0 0 0 1px rgba(243, 234, 212, 0.32);
      }
      .osd-cross-x, .osd-cross-y {
        position: absolute;
        background: rgba(157, 179, 200, 0.32);
      }
      .osd-cross-x { left: 10%; right: 10%; height: 1px; top: 50%; }
      .osd-cross-y { top: 10%; bottom: 10%; width: 1px; left: 50%; }
      .osd-nub {
        position: absolute; left: 50%; top: 50%;
        width: 11px; height: 11px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 0 1px rgba(12, 18, 14, 0.55), 0 1px 6px rgba(0, 0, 0, 0.45);
        transform: translate(-50%, -50%);
      }
      .osd-gimbal-cap {
        margin-top: 6px;
        font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--slate); text-align: center;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }

      /*
       * Thumb sticks, src/input/touchsticks.js. The ZONES are the
       * catchment, most of each lower corner, invisible; the drawn gimbal
       * is an instrument inside them and takes no pointer events of its
       * own. The zones stop at 68 percent of the height so the chips and
       * the music dock along the top stay tappable even on a short phone,
       * and everything in them refuses text selection, callouts and
       * browser gestures: a thumb hold is a stick hold.
       */
      .touch-fly { position: absolute; inset: 0; pointer-events: none; }
      .touch-fly[hidden] { display: none; }
      .touch-zone {
        position: absolute; bottom: 0; height: 68%; width: 44%;
        pointer-events: auto; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        display: flex; align-items: flex-end;
      }
      .touch-zone-left {
        left: 0; justify-content: flex-start;
        padding-left: max(16px, env(safe-area-inset-left));
      }
      .touch-zone-right {
        right: 0; justify-content: flex-end;
        padding-right: max(16px, env(safe-area-inset-right));
      }
      .touch-gimbal {
        pointer-events: none;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }
      /* Doubled from 30vmin on the owner's phone report: a bigger box is
         more glass per degree, because the deflection travel in
         touchsticks.js scales off the drawn plate's width. Landscape only;
         the portrait block below keeps the smaller plates, because two
         doubled plates are wider than a portrait phone. */
      .touch-plate {
        width: clamp(200px, 60vmin, 300px);
        height: clamp(200px, 60vmin, 300px);
        background: rgba(12, 18, 14, 0.30);
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }
      .touch-plate.is-held {
        background: rgba(12, 18, 14, 0.46);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.55);
      }
      .touch-nub { width: 24px; height: 24px; }
      /* Under the bug chip, same right edge: the two chips a pilot needs in
         flight on glass, stacked where the right thumb flicks up to. The
         two-class selector is load-bearing: .bug-chip sets top 16px LATER
         in this sheet, and a bare .touch-pause lost to it and stacked the
         two chips on the same pixels. */
      .touch-fly .touch-pause { top: 52px; }
      /* The rotate hint, only while the sticks are up and the phone is
         tall. It does not block anything: the sticks still work, the hint
         just says why everything is cramped. */
      .touch-rotate {
        display: none;
        position: absolute; left: 50%; top: 38%;
        transform: translate(-50%, -50%);
        padding: 10px 18px; border-radius: 999px;
        background: rgba(16, 22, 17, 0.85); color: var(--amber);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.4);
        font-size: 15px; letter-spacing: 0.06em; white-space: nowrap;
        pointer-events: none;
      }
      @media (orientation: portrait) {
        .touch-fly:not([hidden]) .touch-rotate { display: block; }
      }
      .turtle-on .touch-rotate { display: none !important; }
      /*
       * While the thumb sticks are up, the OSD corners STACK in the centre
       * column: the doubled plates own both lower corners outright, and
       * two side-by-side corner blocks no longer fit between them on a
       * common phone width (an 800 px landscape leaves 264 px of gap).
       * Stacked and centred they need one column 170 px wide, which every
       * phone this runs on has. The timer drops a size for the same
       * reason.
       */
      .touch-fly-on .osd-corner {
        bottom: 8px; width: 170px; font-size: 13px;
        text-align: center;
      }
      .touch-fly-on .osd-left { left: 50%; transform: translateX(-50%); bottom: 116px; }
      .touch-fly-on .osd-right { right: auto; left: 50%; transform: translateX(-50%); }
      .touch-fly-on .osd-timer { font-size: 30px; }
      .touch-fly-on .osd-value { font-size: 16px; }
      /* Portrait is the hinted-away state, but it still has to be tidy:
         the plates go back to the single size, because two doubled plates
         are wider than the screen, and the corners go back to a split pair
         riding above them. */
      @media (orientation: portrait) {
        .touch-plate {
          width: clamp(112px, 30vmin, 168px);
          height: clamp(112px, 30vmin, 168px);
        }
        .touch-fly-on .osd-corner { bottom: 186px; }
        .touch-fly-on .osd-left { left: calc(50% - 164px); transform: none; text-align: left; }
        .touch-fly-on .osd-right { left: auto; right: calc(50% - 164px); transform: none; text-align: right; }
      }
      /* Eleven pause rows do not fit a phone held sideways. The modal list
         scrolls rather than running off the glass; thumbs already know how. */
      @media (max-height: 540px) {
        .screen-modal .menu { max-height: calc(66vh - var(--bars)); overflow-y: auto; }
      }

      .banner.panel {
        background: rgba(16, 22, 17, 0.92); border-radius: 4px;
        padding: 18px 24px; box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.45);
        font-size: 30px; color: var(--cream); line-height: 1.35;
        max-width: min(92vw, 22em); white-space: pre-wrap; transition: none;
      }
      .banner {
        /* 22 percent, not 38. A regulation gate's aperture centre sits at
           0.762 m and the FPV camera is tilted up, so the target lands low in
           the frame, and a pilot found the launch banner drawn directly over
           the one thing they need to find. */
        position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%);
        text-align: center; white-space: pre-wrap; font-size: 30px; font-weight: 600;
        letter-spacing: 0.04em; color: var(--amber); opacity: 0;
        transition: opacity 0.18s ease; text-shadow: 0 3px 10px rgba(0,0,0,0.9);
        max-width: min(92vw, 22em);
      }

      .readout {
        position: absolute; right: 16px; top: 14px; display: none;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--slate); white-space: pre; text-align: right;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      }

      /* Screens. */
      .screen {
        position: absolute; inset: 0; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: calc(2vh + var(--bar-top)) 6vw calc(2vh + var(--bar-bot));
        box-sizing: border-box;
        /* Enough scrim to read type over a bright valley, not enough to
           turn a warm afternoon into night. Forest-tinted, not navy. */
        background:
          radial-gradient(120% 90% at 50% 42%, rgba(18, 26, 18, 0.58), rgba(12, 18, 14, 0.76));
      }
      /* The title is a HUD over the live map. Copy on the left (or top
         and bottom on a phone), the world and the flying airframe fill
         the rest. The wash is a hole, not a second landscape. */
      .screen-title {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: stretch;
        width: 100%;
        height: 100%;
        padding: 4.5vh 4vw calc(1.5vh + var(--bar-bot));
        background:
          linear-gradient(90deg, rgba(12, 18, 14, 0.78) 0%, rgba(12, 18, 14, 0.42) 26%, rgba(12, 18, 14, 0.08) 52%, rgba(12, 18, 14, 0.10) 100%),
          linear-gradient(180deg, rgba(12, 18, 14, 0.32) 0%, transparent 22%, transparent 64%, rgba(12, 18, 14, 0.38) 100%);
      }
      .title-copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: min(36em, 46vw);
        height: 100%;
        min-width: 0;
        min-height: 0;
        z-index: 1;
      }
      .screen-page { justify-content: center; }

      /*
       * The flight-controller screen, restored. Configurator 10.10
       * (firmware 4.5.1 era): #ffbb00 header, #4d4d4d body, dark left
       * tabs. Homage: our layout, system fonts, no Vue, no MSP, no
       * iframe, and no CLI paste anywhere. Title and Settings stay cream
       * and sakura; this screen alone wears the yellow.
       */
      .screen-fc {
        --bf-accent: #ffbb00;
        --bf-ink: #1a1a1a;
        --bf-bg: #4d4d4d;
        --bf-header: #393b3e;
        --bf-panel: #414141;
        --bf-box: #3a3a3a;
        --bf-text: #ffffff;
        --bf-muted: #c5c5c5;
        --bf-grey: #9c9c9c;
        align-items: stretch;
        justify-content: flex-start;
        padding: 0;
        background: var(--bf-bg);
        color: var(--bf-text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .fc-head {
        flex: 0 0 auto;
        background: var(--bf-accent);
        color: var(--bf-ink);
        padding: 8px 14px 7px;
        pointer-events: auto;
      }
      .fc-brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      .fc-wordmark { font-size: 22px; font-weight: 800; letter-spacing: 0.14em; line-height: 1; }
      .fc-fw, .fc-conn {
        font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      }
      .fc-dirty {
        margin-left: auto; color: var(--bf-ink);
        font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
      }
      .fc-dirty:empty { display: none; }
      .fc-homage { margin: 4px 0 0; max-width: 86em; color: #3a3208; font-size: 11px; line-height: 1.4; }
      .fc-homage a { color: var(--bf-ink); font-weight: 700; pointer-events: auto; }
      .fc-exit {
        flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 8px 14px; background: #2a2a2a; border-bottom: 1px solid #1a1a1a;
        pointer-events: auto;
      }
      .fc-exit[hidden] { display: none !important; }
      .fc-exit-btn {
        border: 0; border-radius: 4px; font: inherit; font-size: 13px; font-weight: 800;
        letter-spacing: 0.02em; padding: 8px 14px; cursor: pointer;
      }
      .fc-exit-save { background: var(--bf-accent); color: var(--bf-ink); }
      .fc-exit-save:hover, .fc-exit-save:focus-visible { background: #ffd24d; outline: none; }
      .fc-exit-save[hidden] { display: none; }
      .fc-exit-leave { background: #5c5c5c; color: #fff; }
      .fc-exit-leave:hover, .fc-exit-leave:focus-visible { background: #6e6e6e; outline: none; }
      .fc-exit-hint {
        margin-left: auto; display: flex; align-items: center; gap: 8px;
        color: var(--bf-muted); font-size: 13px; font-weight: 650;
      }
      .fc-exit-hint kbd {
        display: inline-block; min-width: 1.6em; padding: 2px 6px; border-radius: 3px;
        background: #1a1a1a; color: var(--bf-accent);
        font: 700 12px/1.2 ui-monospace, "Cascadia Mono", monospace;
        text-align: center; box-shadow: 0 1px 0 #000;
      }
      .fc-body { display: flex; gap: 0; flex: 1 1 auto; min-height: 0; width: 100%; pointer-events: auto; }
      .fc-tabs {
        flex: 0 0 12.5em; overflow-y: auto; background: var(--bf-header); padding: 8px 0;
        pointer-events: auto; scrollbar-width: thin; scrollbar-color: #ffbb00 #2e2e2e;
      }
      .fc-tab {
        display: block; width: 100%; text-align: left; border: 0; background: transparent;
        color: var(--bf-text); font: inherit; font-size: 13px; padding: 7px 12px 7px 14px;
        cursor: pointer; border-left: 3px solid transparent;
      }
      .fc-tab:hover { background: rgba(255, 187, 0, 0.08); }
      .fc-tab.on {
        background: var(--bf-panel); border-left-color: var(--bf-accent);
        color: var(--bf-accent); font-weight: 650;
      }
      .fc-tab.grey { color: var(--bf-grey); }
      .fc-tab.grey.on { color: var(--bf-muted); border-left-color: var(--bf-grey); }
      .fc-work {
        flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
        min-height: 0; background: var(--bf-panel); overflow: auto;
      }
      .fc-pages {
        display: flex; gap: 0; flex: 0 0 auto; position: sticky; top: 0; z-index: 2;
        background: var(--bf-header); border-bottom: 1px solid #2a2a2a;
      }
      .fc-pages[hidden] { display: none !important; }
      .fc-page {
        border: 0; background: transparent; color: var(--bf-muted); font: inherit;
        font-size: 13px; font-weight: 650; letter-spacing: 0.03em;
        padding: 8px 12px; cursor: pointer; border-bottom: 3px solid transparent;
      }
      .fc-page.on { color: var(--bf-accent); border-bottom-color: var(--bf-accent); background: var(--bf-panel); }
      .screen-fc .menu-stage {
        display: grid;
        grid-template-columns: 1fr minmax(14em, 22em);
        align-items: stretch;
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        margin-top: 0;
      }
      .screen-fc .menu-stage .menu {
        grid-column: 1; background: var(--bf-box); border-top: 0; border-radius: 0;
        box-shadow: none; min-width: 0; width: 100%; height: 100%; margin-top: 0;
        /* A little air at the top. The header strip above overlaps the
         * first row by about ten pixels, which never showed while the first
         * row was a Tab picker under a page strip and does show the moment
         * a confirm panel puts a real row against the ceiling. */
        padding: 6px 0 12px;
      }
      .screen-fc .menu-scroll { max-height: none; height: 100%; scrollbar-color: #ffbb00 #2e2e2e; }
      .screen-fc .menu-help {
        grid-column: 2; color: var(--bf-muted); border-left: 1px solid #2a2a2a;
        background: var(--bf-header); padding: 12px 14px; max-width: none;
      }
      .screen-fc .row { gap: 10px; padding: 7px 16px 7px 18px; font-size: 13px; color: var(--bf-text); }
      .screen-fc .row.on {
        color: var(--bf-text); border-left-color: var(--bf-accent);
        background: linear-gradient(90deg, rgba(255, 187, 0, 0.16), rgba(255, 187, 0, 0) 48%);
      }
      .screen-fc .row-label { font-family: inherit; font-size: 13px; }
      .screen-fc .row-value {
        max-width: none; overflow: visible; text-overflow: clip; color: var(--bf-accent);
      }
      .screen-fc .row-grey { color: var(--bf-grey); }
      .screen-fc .row-grey .row-value { color: var(--bf-grey); }
      .screen-fc .row-gated .row-value { color: var(--bf-accent); }
      .screen-fc .fc-section {
        color: var(--bf-accent); font-size: 11px; font-weight: 800;
        letter-spacing: 0.12em; text-transform: uppercase;
        border-bottom: 1px solid #555; margin-top: 8px; pointer-events: none;
      }
      /*
       * PINNED. Save was a row inside the scrolling list, so after typing a
       * value into the last live field of the PID Profile page a pilot had
       * to arrow back up 96 rows to reach it. The bar is built into the
       * list so it keeps its place in the cursor order, and sticky is what
       * keeps it on screen without moving it out of that order.
       */
      .screen-fc .fc-bar {
        display: flex; gap: 8px; padding: 10px 12px 6px; flex-wrap: wrap;
        position: sticky; top: 0; z-index: 2;
        background: var(--bf-panel);
        box-shadow: 0 6px 10px -6px rgba(0, 0, 0, 0.55);
      }
      .screen-fc .fc-btn {
        background: var(--bf-accent); color: var(--bf-ink); font-weight: 700; margin: 0;
        border-radius: 3px; border-left: 0; flex: 1 1 6em; justify-content: center;
        padding: 8px 10px;
      }
      .screen-fc .fc-btn .row-label { color: var(--bf-ink); font-weight: 700; }
      .screen-fc .fc-btn.on { background: #ffd24d; color: var(--bf-ink); border-left: 0; }
      .fc-status {
        flex: 0 0 auto; background: var(--bf-accent); color: var(--bf-ink);
        font-size: 11px; font-weight: 650; letter-spacing: 0.04em; padding: 5px 14px;
        pointer-events: auto;
      }
      .fc-attitude {
        display: block; margin: 12px 16px; width: 220px; height: 220px;
        background: #2e2e2e; border: 1px solid #6b6b6b; pointer-events: none;
      }
      .fc-attitude[hidden] { display: none !important; }
      @media (max-width: 900px) {
        .screen-fc .menu-stage { grid-template-columns: minmax(0, 1fr); }
        .screen-fc .menu-help { grid-column: auto; max-width: none; border-left: none; }
        .fc-tabs { flex: 0 0 8.5em; }
        .fc-wordmark { font-size: 16px; }
      }
      .screen-maps {
        justify-content: flex-start;
        padding-top: 7vh;
      }
      .screen h1, .wordmark {
        margin: 0; font-size: clamp(44px, 8vw, 104px); font-weight: 800;
        letter-spacing: 0.08em; padding-left: 0.02em; color: var(--cream);
        line-height: 0.92;
        text-shadow: 3px 3px 0 rgba(20, 28, 20, 0.82), 0 10px 28px rgba(0, 0, 0, 0.32);
      }
      .wordmark .fpv { color: var(--sakura); }
      .screen h2 {
        margin: 0 0 18px; font-size: clamp(24px, 3.4vw, 40px); font-weight: 700;
        letter-spacing: 0.04em; color: var(--cream);
      }
      .screen-maps h2 {
        align-self: flex-start;
        margin-bottom: 8px;
      }
      .screen-maps h2::after {
        content: "";
        display: block;
        width: 36px; height: 2px;
        background: var(--sakura);
        margin-top: 10px;
      }
      .screen h3 {
        margin: 0 0 10px; font-size: 15px; font-weight: 700; color: var(--sakura);
        letter-spacing: 0.12em; text-transform: uppercase;
      }
      .brand { text-align: center; margin-bottom: 34px; }
      .screen-title .brand {
        text-align: left;
        margin-bottom: 0;
        max-width: 36em;
      }
      .brand-sub {
        display: flex; align-items: center; gap: 12px;
        margin-top: 12px; font-size: clamp(13px, 1.4vw, 16px); color: #d8d2c0;
        letter-spacing: 0.28em; text-transform: uppercase;
      }
      .brand-sub:empty, .brand-best:empty { display: none; }
      .brand-sub::before {
        content: "";
        width: 36px; height: 2px; flex: 0 0 auto;
        background: var(--sakura);
      }
      .brand-best {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 16px; padding: 7px 14px; border-radius: 3px;
        font-size: 14px; color: var(--cream); letter-spacing: 0.05em;
        background: rgba(16, 22, 17, 0.62);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.45);
      }
      .brand-best-time { color: var(--mint); font-weight: 650; }
      /* The beta notice. Amber, because it is an instrument reading on
         the software rather than a record or a piece of chrome, and it
         keeps the same left edge as everything else in the brand block so
         it reads as part of the title rather than as a bolted on toast. */
      .beta-note {
        display: flex; align-items: baseline; gap: 10px;
        max-width: 34em; margin: 14px 0 0;
        font-size: 13.5px; line-height: 1.6; letter-spacing: 0.01em;
        color: rgba(235, 230, 215, 0.78);
      }
      .beta-tag {
        flex: 0 0 auto;
        padding: 3px 9px; border-radius: 3px;
        font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--amber);
        background: rgba(16, 22, 17, 0.62);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.45);
      }
      .screen-title .beta-note { text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65); }
      .keep-note {
        max-width: 34em; margin: 14px 0 0; color: rgba(235, 230, 215, 0.72);
        font-size: 13.5px; line-height: 1.6; letter-spacing: 0.01em;
      }
      /* First run swaps the storage warning, which is a returning pilot's
         problem, for the one sentence that gets somebody airborne. */
      /* :not(.first-note) because the first note IS a keep-note, so the
         plain .keep-note hide below would match it at the same specificity
         and, being later, win. */
      .first-note { display: none; }
      .screen-title.is-first .first-note { display: block; }
      .screen-title.is-first .keep-note:not(.first-note),
      .screen-title.is-first .brand-best,
      .screen-title.is-first .wiki-teaser { display: none; }
      .wiki-teaser {
        display: inline-flex; align-items: center; gap: 10px;
        margin: 14px 0 0; padding: 0; border: 0; background: none;
        color: var(--sakura); font: inherit; font-size: 13.5px;
        letter-spacing: 0.12em; text-transform: uppercase;
        cursor: pointer; pointer-events: auto; text-align: left;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .wiki-teaser:hover, .wiki-teaser:focus-visible { color: var(--cream); }
      .wiki-teaser::before {
        content: "";
        width: 28px; height: 2px; flex: 0 0 auto;
        background: var(--sakura);
      }
      .screen-title .brand-sub {
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
      }
      .screen-title .keep-note {
        margin-left: 0;
        margin-right: auto;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }

      /* The menu is a fixed-width centre column. Help text lives in the
         right column so a long note cannot grow the list and shove the
         whole screen around. 1fr / auto / 1fr keeps the rows centred.
         The title pins the same note ABOVE the footer, out of flow, so
         a longer hover line cannot drop the rows. */
      /* SYMMETRIC, so the menu is centred where the heading says it is.
         The columns used to be 1.7fr / auto / 0.65fr, which put the panel
         195 px right of a centred h2 on a 1440 px screen: the heading and
         the thing it names did not line up on Paused or How to fly. The
         screens that fill column one (Settings' airframe studio) override
         this below; nothing else was using the extra width. */
      .menu-stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        width: min(1600px, 98vw);
        align-items: start;
        margin-top: 22px;
        pointer-events: none;
      }
      .screen-settings .menu-stage {
        width: 100%;
        max-width: 1600px;
        grid-template-columns: minmax(360px, 1.7fr) auto minmax(0, 0.65fr);
      }
      /*
       * Settings on a laptop. NOT part of the flight-controller removal, but
       * found by measuring the Rates screen beside it: below about 1100 px
       * the three columns cannot fit their own minimums (360 for the quad
       * plus 540 for the menu is already 900 before the note column), so the
       * stage overflowed and the menu slid off the right of the window
       * entirely. One column, quad on top, same fallback Rates takes.
       */
      @media (max-width: 1100px) {
        .screen-settings .menu-stage { grid-template-columns: minmax(0, 1fr); }
        .screen-settings .craft-showcase {
          grid-column: 1; grid-row: 1;
          justify-self: center; width: min(100%, 420px); margin: 0 0 12px;
        }
        .screen-settings .menu-stage .menu { grid-column: 1; justify-self: center; }
        .screen-settings .menu-help {
          grid-column: 1; max-width: none; border-left: 0;
          padding: 8px 14px 0; margin-top: 6px; text-align: center;
        }
      }
      .title-foot {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-end;
        gap: 14px;
        width: 100%;
        margin-top: auto;
        position: relative;
        /* Shrinkable, so the menu inside it can be. Without this the
         * column keeps its content height and the overflow just moves
         * up a level. */
        min-height: 0;
      }
      /*
       * ELEVEN ROWS AND A SHORT WINDOW. The title menu is taller than a
       * laptop window can hold: measured at 1536 by 776 the menu ran to
       * 914 px, so Leaderboard, Credits and the report row sat below the
       * fold, invisible and unreachable by mouse. The column above it is
       * fixed copy, so the menu is the part that yields: it shrinks and
       * scrolls rather than running off the bottom. On a window with room
       * for all of it nothing here changes anything, because a flex item
       * only shrinks once it has to.
       */
      .screen-title .menu-stage {
        display: flex;
        flex-direction: column;
        position: static;
        width: 100%;
        margin-top: 0;
        flex: 0 1 auto;
        min-height: 0;
      }
      .screen-title .menu {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .menu {
        min-width: min(540px, 82vw);
        margin-top: 16px;
        pointer-events: auto;
        padding: 10px 0 12px;
        border-radius: 4px;
        background: rgba(16, 22, 17, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        border-top: 2px solid rgba(232, 168, 184, 0.55);
      }
      .screen-title .menu { min-width: 0; width: 100%; margin-top: 0; background: rgba(16, 22, 17, 0.55); }
      .menu-stage .menu { grid-column: 2; margin-top: 0; }
      .menu-scroll {
        max-height: min(calc(58vh - var(--bars)), 34em);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .menu-help {
        grid-column: 3;
        padding: 12px 12px 8px 22px;
        margin-top: 8px;
        max-width: 26em;
        color: rgba(235, 230, 215, 0.72);
        font-size: 14px;
        line-height: 1.55;
        overflow-wrap: break-word;
        border-left: 1px solid rgba(244, 236, 214, 0.16);
      }
      .menu-help:empty { border-left-color: transparent; padding: 0; }
      .screen-title .menu-help {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100%;
        width: auto;
        max-width: none;
        margin: 0;
        padding: 0 4px 10px;
        height: auto;
        text-align: left;
        border: none;
        overflow: visible;
        pointer-events: none;
        grid-column: auto;
        grid-row: auto;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .screen-title .menu-help:empty {
        padding: 0;
      }
      /*
       * The handoff between the two blocks of body copy in this column.
       * The note above grows upward out of flow and used to be painted on
       * top of the keep note; see syncCursor in src/ui/ui.js for the
       * measurement. Opacity, not display, so nothing moves while it
       * happens and the text stays where a screen reader can find it.
       */
      .screen-title .keep-note,
      .screen-title .first-note {
        transition: opacity 140ms ease;
      }
      .screen-title.has-help .keep-note,
      .screen-title.has-help .first-note {
        opacity: 0;
      }
      .craft-showcase {
        grid-column: 1;
        justify-self: end;
        align-self: center;
        width: min(100%, 760px);
        margin-right: 12px;
        pointer-events: auto;
        overflow: hidden;
        border-radius: 16px;
        background: #1a241c;
        box-shadow: 0 18px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(244, 236, 214, 0.10);
      }
      .craft-showcase-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #1a241c;
      }
      .craft-view {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #1a241c;
        touch-action: none;
      }
      .craft-showcase-cap {
        margin-top: 4px;
        padding: 0 10px 12px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: #b7c4b0;
      }
      /* ---- THE FRAME ---------------------------------------------------
         Two bars outside every screen, in the same pixels on all of them.
         Absolutely positioned and cleared by the screens' own padding, so a
         bar can never render on top of a row. ------------------------------ */
      .frame-top, .frame-bot {
        position: absolute; left: 0; right: 0; z-index: 6;
        display: flex; align-items: center; gap: 14px;
        padding: 0 clamp(14px, 3vw, 34px);
        pointer-events: none;
      }
      .frame-top { top: 0; height: var(--bar-top);
        background: linear-gradient(180deg, rgba(8, 12, 9, 0.86), rgba(8, 12, 9, 0)); }
      .frame-bot { bottom: 0; height: var(--bar-bot);
        background: linear-gradient(0deg, rgba(8, 12, 9, 0.9), rgba(8, 12, 9, 0)); }
      .frame-top[hidden], .frame-bot[hidden] { display: none; }
      .frame-gap { flex: 1; }
      .crumb {
        display: flex; align-items: center; gap: 9px;
        font-size: 11.5px; letter-spacing: 0.15em; text-transform: uppercase;
      }
      .crumb-sep { color: #4a5a52; }
      .crumb-up { color: var(--slate); }
      .crumb-here { color: var(--cream); }
      .frame-context { display: flex; align-items: center; gap: 8px; }
      .frame-chip {
        display: flex; align-items: center; gap: 7px;
        height: 26px; padding: 0 11px; border-radius: 3px;
        background: rgba(20, 28, 22, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.13);
        font-size: 12px; color: var(--slate); white-space: nowrap;
      }
      .frame-chip b { color: var(--cream); font-weight: 600; }
      .frame-chip-key { color: var(--slate); }
      .frame-legend { display: flex; align-items: center; gap: 16px; flex-wrap: nowrap; overflow: hidden; }
      .frame-legend i {
        display: flex; align-items: center; gap: 6px;
        font-style: normal; font-size: 12.5px; color: var(--slate);
      }
      .frame-primary {
        pointer-events: auto; font: inherit; font-size: 15px; font-weight: 700;
        height: 36px; padding: 0 20px; border: 0; border-radius: 3px;
        background: var(--mint); color: var(--deep); cursor: pointer;
      }
      .frame-primary[hidden] { display: none; }
      .frame-primary:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }

      /* ---- ROW GRAMMAR --------------------------------------------------
         The kind of a row is visible before Enter is pressed. A value row
         carries its control, a navigation row a chevron, a link row an
         arrow. See rowKind() in src/ui/ui.js. ----------------------------- */
      .row-nav::after {
        content: "\203A"; margin-left: 10px; color: #55665e;
        font-size: 19px; line-height: 1;
      }
      .row-nav.on::after { color: var(--sakura); }
      .row-link::after {
        content: "\2197"; margin-left: 10px; color: #55665e; font-size: 15px;
      }
      .row-link.on::after { color: var(--slate); }

      /* Touch. Every target reaches 44 px on a coarse pointer, and the row
         shrink below is removed there: on a phone the copy gets smaller, the
         target never does. */
      @media (pointer: coarse) {
        .row, .drop-opt, .fc-tab { min-height: 44px; }
        .step, .row-num { min-height: 44px; }
        .frame-primary { height: 44px; }
      }

      .row {
        display: flex; justify-content: space-between; align-items: center; gap: 16px;
        padding: 10px 22px 10px 28px; border-left: 4px solid transparent;
        color: rgba(238, 232, 216, 0.78);
        font-size: clamp(16px, 1.9vw, 21px); cursor: pointer;
      }
      /* The cursor is a bar and a colour, not a slab. Sakura for chrome.
         Amber stays on the flight instruments, where it has to punch through
         whatever the camera is looking at. */
      .row.on {
        color: var(--cream); border-left-color: var(--sakura);
        background: linear-gradient(90deg, rgba(232, 168, 184, 0.12), rgba(232, 168, 184, 0) 48%);
      }
      .row-info { cursor: default; }
      .row-grey {
        color: rgba(157, 179, 200, 0.62);
        cursor: default;
      }
      .row-grey .row-value, .row-grey .drop-btn { color: var(--slate); opacity: 0.85; }
      .row-grey.on {
        color: rgba(157, 179, 200, 0.92);
        border-left-color: rgba(157, 179, 200, 0.55);
        background: linear-gradient(90deg, rgba(157, 179, 200, 0.10), rgba(157, 179, 200, 0) 48%);
      }
      /*
       * The one thing to press.
       *
       * Every row on every screen used to be the same size, weight and
       * colour, so Fly and Credits were typographic equals and the only
       * hierarchy was a 4 px cursor bar. Mint on dark ink is the treatment
       * the track builder already gives Fly this track, and the rule the
       * builder's own comments state is one green button per screen, so
       * there is exactly one of these in any list.
       */
      /*
       * TWO HIGHLIGHTS, ONE CURSOR.
       *
       * This used to paint a filled mint slab whether or not the cursor was
       * on it, so the title screen showed Fly looking selected while the real
       * cursor sat three rows down on Track. Two things looked selected and
       * only one of them answered Enter. The primary now reads as the primary
       * (mint type, a mint edge) without claiming the selection, and the
       * command bar carries the filled button. Exactly one thing on any
       * screen is filled mint, and it is never a row.
       */
      .row-primary {
        margin: 4px 10px 8px;
        padding: 12px 18px;
        border-radius: 3px;
        border-left: 3px solid transparent;
        background: rgba(125, 255, 180, 0.10);
        box-shadow: inset 0 0 0 1px rgba(125, 255, 180, 0.42);
        color: var(--mint);
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .row-primary .row-label { font-weight: 700; color: var(--mint); }
      /* Selected, and only then, it fills. The cursor is the thing that
         decides, which is the whole point. */
      .row-primary.on {
        border-left-color: var(--sakura);
        background: var(--mint);
        color: var(--deep);
        box-shadow: 0 0 0 2px rgba(243, 234, 212, 0.55);
      }
      .row-primary.on .row-label { color: var(--deep); }

      /* A group heading in a long settings list. Not a row: no cursor, no
         hover, no click. Twenty flat rows in one scroll is a list you read
         rather than a panel you operate. */
      .menu-section {
        margin: 14px 0 2px;
        padding: 0 22px 5px 28px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--sakura);
        border-bottom: 1px solid rgba(232, 168, 184, 0.22);
        pointer-events: none;
      }
      .menu-scroll > .menu-section:first-child { margin-top: 4px; }

      /*
       * Rates. The one flight setting a pilot actually sets by hand, so it
       * gets a screen and a picture rather than a row buried in a list.
       *
       * House palette, not the Betaflight Configurator yellow that used to
       * live here. The flight-controller screen this replaces painted itself
       * #ffbb00 on #4d4d4d as a homage to Configurator 10.10, which was
       * honest about where its several hundred editable firmware keys came
       * from. There are five knobs now, they are ours, and they look it.
       */
      .screen-rates { justify-content: center; }
      .rates-lede {
        max-width: 48em; margin: 0 auto;
        color: rgba(235, 230, 215, 0.78);
        font-size: 15px; line-height: 1.6; text-align: center;
      }
      /*
       * Column one of .menu-stage, the seat the quad takes on Settings.
       *
       * width is pinned to 100% rather than inherited, because the shared
       * rule is `min(1600px, 98vw)` and .screen already spends 6vw a side on
       * padding. At 1440 that is a stage 143 px wider than the box holding
       * it, centred, so the curve hung 70 px off the left of the window.
       * 100% is the padded content box, which is what the stage meant.
       */
      .screen-rates .menu-stage {
        width: 100%;
        max-width: 1600px;
        grid-template-columns: minmax(320px, 1.5fr) auto minmax(0, 0.7fr);
      }
      .rates-panel {
        grid-column: 1;
        justify-self: end;
        align-self: center;
        display: flex; flex-direction: column;
        width: min(100%, 620px);
        margin-right: 18px;
        pointer-events: none;
      }
      /* Same well the menu block sits in, so the two panels read as one
         surface over a bright world rather than two different glasses. */
      .rates-graph-wrap {
        height: clamp(180px, 26vh, 260px);
        border-radius: 4px;
        background: rgba(16, 22, 17, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        overflow: hidden;
      }
      .rates-graph { display: block; width: 100%; height: 100%; }
      .rates-legend {
        display: flex; gap: 20px; flex-wrap: wrap;
        margin-top: 10px;
      }
      .rates-key { display: flex; align-items: baseline; gap: 7px; }
      .rates-key-dot {
        width: 9px; height: 9px; border-radius: 50%;
        align-self: center;
      }
      /* The dashed curve's key: a rule with gaps in it, not a dot, cut with
         a mask so it takes the same inline background colour as the dot. */
      .rates-key-dash {
        width: 18px; height: 2px; border-radius: 0;
        -webkit-mask-image: repeating-linear-gradient(to right, #000 0 5px, transparent 5px 9px);
        mask-image: repeating-linear-gradient(to right, #000 0 5px, transparent 5px 9px);
      }
      .rates-key-lab {
        font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
        color: rgba(235, 230, 215, 0.66);
      }
      .rates-key-val { font-size: 13px; font-weight: 650; color: var(--cream); }
      /* Four small facts under the curve. auto-fit rather than a fixed four
         columns, because this sits in a grid column whose width is a share
         of the window: at 1366 that column is 451 px, four columns of it are
         113 px each, and "19.5% stick" is wider than that, so the last cell
         used to spill out from under the curve and across the menu beside
         it. A track floor wraps instead of overflowing.

         The floor is 152 px rather than the 126 it was when a cell held at
         most two numbers. A split pitch puts three in it, "185 / 118 / 185
         deg/s", and the dd does not wrap, so at 126 the last cell was
         painted over the one beside it. Four across still fit at 1600; at
         1366 the fourth wraps under, which is the behaviour this floor is
         chosen for. */
      .rates-readout {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(152px, 1fr));
        gap: 10px 14px; margin: 14px 0 0;
      }
      .rates-cell { min-width: 0; }
      .rates-readout dt {
        font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
        color: rgba(157, 179, 200, 0.85);
      }
      .rates-readout dd {
        margin: 3px 0 0; font-size: 14px; font-weight: 650;
        color: var(--cream); white-space: nowrap;
      }
      /* Each number in its own curve's colour, painted inline by
         src/ui/ratespanel.js, so a split reading needs no key. A number the
         same as the one before it is hidden rather than repeated. */
      .rates-num { color: var(--cream); }
      .rates-num-sep, .rates-num-unit { color: rgba(235, 230, 215, 0.6); font-weight: 500; }
      .rates-num[hidden], .rates-num-sep[hidden] { display: none; }
      .screen-rates .menu-scroll { max-height: min(calc(52vh - var(--bars)), 30em); }
      /*
       * The PIDs screen wears .screen-rates as well as .screen-pids, ON
       * PURPOSE: it is the Rates screen's layout with bars where the curve
       * is, and duplicating every stage, scroll and narrow-window rule for
       * a second class is how the two screens would drift apart. Only what
       * differs is named here.
       */
      .pids-caption {
        font-size: 12px; letter-spacing: 0.06em;
        color: rgba(235, 230, 215, 0.66);
        margin-bottom: 8px;
      }
      /* Three axes of five numbers each: one cell per axis, kept on one
         line by the shared dd nowrap, so the floor is wider than the rates
         cells' four-number floor. */
      .pids-readout { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
      .row-label { min-width: 0; flex: 1 1 auto; }
      /*
       * THE SELECTED LABEL IS EMBOLDENED WITHOUT CHANGING ITS METRICS.
       *
       * This was font-weight: 650, and a heavier label is a WIDER label.
       * The menu sits in an `auto` grid track, so that track is sized to
       * the widest row it contains, and bolding whichever row the cursor
       * happens to be on grew the whole menu: 8 px on Settings, 19 px on
       * PIDs. That shoved the menu sideways and squeezed the columns
       * either side of it hard enough to resize the craft preview, which
       * changed the stage height and moved the menu vertically as well.
       * Measured per row, every row was identical except the one under
       * the cursor.
       *
       * It was reported as the note text moving the menu, because the note
       * changes at the same instant the cursor does. The note was never
       * the cause: its own height swings 0 to 302 px and moves nothing,
       * because the stage aligns to start and the menu is the taller of
       * the two.
       *
       * A text-shadow PAINTS the emphasis rather than re-setting the type,
       * so glyph advance widths cannot change and neither can the layout.
       * Two offsets rather than one so the thickening is symmetric and the
       * label does not appear to creep to the right. Measured after the
       * change: 0.00 px of movement on every menu screen.
       */
      .row.on .row-label {
        text-shadow: -0.02em 0 0 currentColor, 0.02em 0 0 currentColor;
      }
      .row-value {
        color: var(--sakura); font-size: 0.86em; font-weight: 600;
        letter-spacing: 0.03em; flex: 0 1 auto; min-width: 0;
        max-width: 52%; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; text-align: right;
      }
      .row-control {
        display: flex; align-items: center; gap: 8px; flex: 0 1 auto; min-width: 0;
      }
      .step-col {
        display: inline-flex; flex-direction: column; gap: 2px;
      }
      .step {
        width: 1.35em; height: 1.05em; padding: 0; border: 0; border-radius: 3px;
        background: rgba(232, 168, 184, 0.16); color: var(--sakura); cursor: pointer;
        font-size: 9px; line-height: 1; display: grid; place-items: center;
      }
      .step:hover { background: rgba(232, 168, 184, 0.32); }
      /*
       * The typed value on the Rates screen.
       *
       * A real text field rather than a list, because a rate a pilot has in
       * their head has to be enterable and no list of a dozen steps carries
       * it. Sized in ch so 2.55 and 2000 both sit inside it, right aligned
       * so the digits line up down the column, and it wears the same sakura
       * the dropdown value does so a row reads the same whichever kind it
       * is. See makeNumber in src/ui/ui.js.
       */
      .row-num {
        width: 5ch; padding: 3px 6px; border: 0; border-radius: 3px;
        background: rgba(232, 168, 184, 0.10);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.28);
        color: var(--sakura); font: inherit; font-size: 0.86em; font-weight: 600;
        text-align: right; letter-spacing: 0.03em;
      }
      .row-num:focus {
        outline: none; background: rgba(232, 168, 184, 0.18);
        box-shadow: inset 0 0 0 1px var(--sakura);
        color: var(--cream);
      }
      .row-num-unit {
        font-size: 0.78em; color: rgba(157, 179, 200, 0.9);
        white-space: nowrap;
      }
      /*
       * A drag slider, the control Configurator gives its tuning sliders.
       * Native input[type=range] so drag, touch and focused arrow keys are
       * the browser's problem, restyled to the house: a thin cream track
       * with a mint thumb, and the number field beside it stays typable.
       * The .screen-fc block recolours the same control Configurator
       * yellow. Track and thumb need the vendor prefixes separately;
       * a shared rule silently drops the whole selector.
       */
      .row-slider { gap: 10px; }
      .row-range {
        appearance: none; -webkit-appearance: none;
        width: clamp(110px, 16vw, 220px); height: 18px;
        background: transparent; cursor: pointer;
        pointer-events: auto;
      }
      .row-range::-webkit-slider-runnable-track {
        height: 4px; border-radius: 2px;
        background: rgba(244, 236, 214, 0.22);
      }
      .row-range::-moz-range-track {
        height: 4px; border-radius: 2px;
        background: rgba(244, 236, 214, 0.22);
      }
      .row-range::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px; height: 14px; border-radius: 50%;
        margin-top: -5px;
        background: var(--mint); border: 0;
        box-shadow: 0 0 0 1px rgba(12, 18, 14, 0.6), 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      .row-range::-moz-range-thumb {
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--mint); border: 0;
        box-shadow: 0 0 0 1px rgba(12, 18, 14, 0.6), 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      .row-range:focus-visible { outline: 1px solid var(--mint); outline-offset: 2px; }
      .row-range-num { width: 4ch; }
      .screen-fc .row-range::-webkit-slider-runnable-track { background: #2a2a2a; }
      .screen-fc .row-range::-moz-range-track { background: #2a2a2a; }
      .screen-fc .row-range::-webkit-slider-thumb { background: var(--bf-accent); }
      .screen-fc .row-range::-moz-range-thumb { background: var(--bf-accent); }
      .screen-fc .row-range:focus-visible { outline-color: var(--bf-accent); }
      .screen-fc .row-num {
        background: #2a2a2a; box-shadow: inset 0 0 0 1px #5a5a5a; color: #fff;
      }
      .screen-fc .row-num:focus { box-shadow: inset 0 0 0 1px var(--bf-accent); }
      .drop-btn {
        appearance: none; border: 0; background: transparent;
        color: var(--sakura); font: inherit; font-size: 0.86em;
        cursor: pointer; padding: 2px 2px 2px 8px;
        display: inline-flex; align-items: center; gap: 8px;
        max-width: 100%; text-align: right; line-height: 1.25;
      }
      .drop-btn::after {
        content: ""; width: 0; height: 0; flex: 0 0 auto;
        border-left: 4px solid transparent; border-right: 4px solid transparent;
        border-top: 5px solid var(--sakura); opacity: 0.85;
      }
      .drop-list {
        position: fixed; z-index: 20; pointer-events: auto;
        max-height: min(280px, calc(46vh - var(--bars))); overflow-y: auto;
        padding: 6px 0; border-radius: 4px;
        background: rgba(16, 22, 17, 0.97);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.28), 0 14px 32px rgba(0, 0, 0, 0.55);
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .drop-opt {
        display: block; width: 100%; box-sizing: border-box;
        border: 0; background: transparent; color: rgba(238, 232, 216, 0.78);
        font: inherit; font-size: 15px; text-align: left;
        padding: 7px 16px; cursor: pointer;
      }
      .drop-opt:hover, .drop-opt.on { color: var(--cream); background: rgba(232, 168, 184, 0.12); }
      /* A narrow window stacks the curve over the rows rather than
         squeezing both. Same breakpoint the rest of the page uses. */
      /* One column: the curve stacks over the rows rather than squeezing
         both, and the note moves under the list where there is width for
         it. Everything shrinks a little, because a window this size has to
         hold the curve, seven rows and the hint at once. */
      @media (max-width: 1100px) {
        .screen-rates .menu-stage { grid-template-columns: minmax(0, 1fr); }
        .rates-panel {
          grid-column: 1; grid-row: 1;
          justify-self: center; width: min(100%, 620px); margin: 0 0 12px;
        }
        .screen-rates .menu-stage .menu { grid-column: 1; justify-self: center; }
        .screen-rates .menu-help {
          grid-column: 1; max-width: none; border-left: 0;
          padding: 8px 14px 0; margin-top: 6px; text-align: center;
        }
        .rates-graph-wrap { height: clamp(140px, 20vh, 200px); }
        .screen-rates .menu-scroll { max-height: calc(34vh - var(--bars)); }
        /* The note moved under the list in this layout, so the hint no
           longer needs the full gap: at 900 by 760 the longest note pushed
           it three pixels below the fold. */
        .screen-rates .hint { margin-top: 12px; }
        /* Narrow enough to clear the music dock and the bug chip, which are
           fixed to the top right corner and sit over any screen. At 48em the
           last words of this sentence went under them. */
        .rates-lede { max-width: 34em; }
      }
      /* A short window spends its height on the curve and the rows: the
         lede is the one thing here that repeats what the row notes say, and
         the curve gives up the pixels the list needs to show all seven rows
         rather than six and a half. */
      @media (max-height: 820px) {
        .rates-graph-wrap { height: clamp(118px, 16vh, 160px); }
        .screen-rates .menu-scroll { max-height: calc(46vh - var(--bars)); }
      }
      /* Shorter still, and the lede is the first thing to go: it is the one
         line here that the row notes already say in more detail. */
      @media (max-height: 700px) {
        .rates-lede { display: none; }
        /* A 1024 by 700 window is 14 px short with the lede already gone and
           the longest note showing, so the curve gives up those pixels. It
           is a shape, not a table: it survives being short far better than
           the rows survive being cut. */
        .rates-graph-wrap { height: clamp(100px, 14vh, 140px); }
        .screen-rates .hint { margin-top: 8px; }
      }
      /* Superseded by the command bar, which says the same thing in the same
         place on every screen. Kept in the DOM so the screens that build one
         do not need surgery, and so a screen reader still finds the text. */
      .hint { display: none; }
      .hint-legacy {
        display: flex; align-items: center; gap: 12px;
        margin-top: 22px; min-height: 1.4em; max-width: 42em;
        font-size: 13px; color: rgba(235, 230, 215, 0.6); letter-spacing: 0.02em; text-align: center;
        pointer-events: none;
      }
      .screen-modal .hint {

        margin-right: auto;
        color: rgba(235, 230, 215, 0.8);
      }
      .title-foot .hint {

      }
      .hint-keys { display: inline-flex; gap: 4px; flex: 0 0 auto; }
      .hint kbd {
        font-family: inherit; font-size: 11px; font-weight: 650;
        padding: 2px 7px; border-radius: 3px;
        border: 1px solid rgba(235, 230, 215, 0.35);
        color: #e8e2d0; background: rgba(20, 28, 22, 0.55);
      }
      .screen-calibrate {
        pointer-events: auto;
      }
      .cal-kicker {
        font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--sakura); margin-bottom: 10px;
      }
      .cal-prompt {
        margin: 0; max-width: 28em; text-align: center;
        font-size: clamp(18px, 2.4vw, 28px); font-weight: 600;
        line-height: 1.35; color: var(--cream);
      }
      .cal-hint {
        margin: 10px 0 0; min-height: 1.4em; text-align: center;
        font-size: 14px; color: var(--slate);
      }
      .cal-sticks {
        display: flex; align-items: flex-end; gap: 36px;
        margin: 28px 0 16px;
      }
      .screen-calibrate .osd-gimbal-plate {
        width: 120px; height: 120px;
        background: rgba(12, 18, 14, 0.55);
      }
      .cal-steps {
        list-style: none; display: flex; flex-wrap: wrap;
        justify-content: center; gap: 8px 14px;
        padding: 0; margin: 4px 0 16px;
        font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase;
        color: rgba(235, 230, 215, 0.38);
      }
      .cal-steps li.on { color: var(--amber); }
      .cal-steps li.done { color: var(--mint); }
      .cal-actions { display: flex; gap: 10px; margin-top: 4px; }
      .cal-actions .name-dialog-btn:disabled { opacity: 0.35; cursor: default; }
      .screen-padpick {
        pointer-events: auto;
        padding: 4vh 4vw 3vh;
      }
      .pad-cards {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 16px; margin: 28px 0 18px; max-width: 1100px;
      }
      .pad-card {
        width: 220px;
        padding: 14px 14px 12px;
        border-radius: 8px;
        border: 1px solid rgba(243, 234, 212, 0.16);
        background: rgba(12, 18, 14, 0.62);
        text-align: center;
        transition: border-color 0.12s linear, box-shadow 0.12s linear;
      }

      }
      .pad-card.is-on {
        border-color: var(--mint);
        box-shadow: 0 0 0 2px rgba(125, 255, 180, 0.7);
      }

        font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--sakura); margin-bottom: 10px;
      }
      .pad-card-art {
        display: flex; justify-content: center; gap: 18px;
        margin-bottom: 10px;
      }
      .pad-card .osd-gimbal-plate {
        width: 72px; height: 72px;
        background: rgba(12, 18, 14, 0.55);
      }
      .pad-card .osd-gimbal-cap { display: none; }
      .pad-card-name {
        font-size: 13px; color: var(--cream);
        min-height: 2.4em; line-height: 1.3;
      }
      .pad-card-status {
        margin-top: 4px; font-size: 12px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--slate);
      }
      .pad-card.is-live .pad-card-status { color: var(--amber); }
      .pad-card.is-on .pad-card-status { color: var(--mint); }
      .pad-actions { flex-wrap: wrap; justify-content: center; }
      @media (max-width: 860px) {
        .menu-stage {
          display: flex; flex-direction: column; align-items: stretch;
          position: relative;
          width: min(540px, 90vw);
        }

        .menu-help {
          max-width: none; margin-top: 10px;
          padding: 8px 16px 0; border-left: none;
        }
        .menu-help:empty { padding: 8px 16px 0; }
        .screen-title {
          padding: 2.6vh 4.5vw 2vh;
          background:
            linear-gradient(180deg, rgba(12, 18, 14, 0.70) 0%, rgba(12, 18, 14, 0.18) 16%, rgba(12, 18, 14, 0.04) 38%, rgba(12, 18, 14, 0.12) 58%, rgba(12, 18, 14, 0.84) 100%);
        }

          width: 100%;
        }
        .screen-title .wordmark {
          font-size: clamp(34px, 11vw, 56px);
        }
        .screen-title .keep-note,
        .screen-title .wiki-teaser { display: none; }
        /* The storage note above goes at this width. The beta notice does
           not: a phone hits the same bugs a desktop does, and it is one
           line where that note was four. */
        .screen-title .beta-note { gap: 8px; margin-top: 10px; font-size: 12.5px; }
        .screen-title .brand-best {
          margin-top: 8px;
          padding: 5px 10px;
          font-size: 12px;
        }
        .screen-title .title-foot {
          flex-direction: column;
          align-items: stretch;

        }
        .screen-title .menu-stage {

          position: static;

        }
        .screen-title .menu-scroll {
          max-height: min(calc(32vh - var(--bars)), 14em);
        }
        .screen-title .menu-help {
          position: absolute;
          left: 0;
          right: 0;

          width: auto;

          text-align: left;

          display: block;
          position: relative;
          width: min(540px, 90vw);
        }
        .screen-maps .menu { grid-column: auto; }
        .howto-body { gap: 18px; }
        .howto-keys { min-width: 0; }
        .screen-maps .menu-help {
          position: absolute;
          left: 0; right: 0;
          bottom: calc(100% + 8px);
          margin: 0;
          padding: 0 8px 8px;
          border-left: none;

        .title-foot .hint { text-align: left; max-width: none; }
        .craft-showcase {

      }
      @media (max-height: 520px) {

      /* The map screen. One card per world, each playing a short flight
         through it. The cursor is the same bar and colour the menu rows
         use, turned on its side: a sakura edge and a lift, never a slab. */
      /* Symmetric, so the row list sits under the middle of the card grid
         rather than pushed right by a help column with no counterweight. */
      .screen-maps .menu-stage {
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        width: min(1200px, 96vw);
        margin: 10px auto 0;
      }
      .screen-maps .menu { grid-column: 2; min-width: min(320px, 86vw); }
      .screen-maps .menu-help { grid-column: 3; max-width: 22em; }
      .screen-courses .menu-scroll { max-height: none; }
      .map-cards {
        display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
        margin: 18px 0 10px; pointer-events: auto;

      }
      .map-card {
        width: min(340px, 82vw); cursor: pointer; border-radius: 4px;
        overflow: hidden; position: relative;
        background: rgba(16, 22, 17, 0.72);

      }

      }
      /* The card whose actions are showing below the strip. It has to read as
         chosen even when the cursor has moved off it onto its own list, which
         is the whole reason the list is not floating free any more. Mint
         rather than sakura: sakura is the cursor, and two pinks a card apart
         would be one state drawn twice. */
      .map-card.chosen {
        border-top-color: var(--mint);
        box-shadow: inset 0 0 0 2px var(--mint), 0 12px 28px rgba(0, 0, 0, 0.45);
      }
      .map-card.chosen.on {

          0 12px 28px rgba(0, 0, 0, 0.45);
      }
