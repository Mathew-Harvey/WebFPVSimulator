<!doctype html>
<!--
  WebFPVSimulator: the page. A canvas for the world, an overlay for the
  product shell (title, how to fly, settings, pause, results, and the
  flight display). The overlay's structure is built in src/ui/ui.js; its
  styling lives here with the rest of the page's CSS.

  Colour rule, the same one the renderer follows: light is warm, shadow is
  cool. Cream and amber for lit type, slate blue for recessed type, mint
  for a record. Nothing in the interface is a grey copy of itself.

  This file is part of WebFPVSimulator.

  the Free Software Foundation, either version 3 of the License, or (at
  your option) any later version.

  WebFPVSimulator is distributed in the hope that it will be useful, but
  WITHOUT ANY WARRANTY, without even the implied warranty of
  MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the GNU
  General Public License for more details.

  You should have received a copy of the GNU General Public License
  along with WebFPVSimulator. If not, see <https://www.gnu.org/licenses/>.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebFPV, a browser FPV racing simulator</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --cream: #f7e8cd;
        --amber: #ffd45c;
        --mint: #7dffb4;
        --slate: #9db3c8;
        --deep: #101a26;
        --ink: rgba(8, 12, 18, 0.85);
        --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #101a26; }
      #view { display: block; width: 100%; height: 100%; }
      #ui {
        position: fixed; inset: 0; pointer-events: none; user-select: none;
        font-family: var(--ui-font); color: var(--cream);
        font-variant-numeric: tabular-nums;
      }

      /* Flight display. Thin warm type over a dark edge, the way an OSD
         reads over any background. */
      .osd { position: absolute; inset: 0; }
      .osd.dim { opacity: 0.4; }
      .osd-top {
        position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
        text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.85);
      }
      .osd-timer { font-size: 46px; font-weight: 600; letter-spacing: 0.02em; line-height: 1; }
      .osd-timer.waiting { color: #b9c9d8; }
      .osd-label {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--slate); margin-bottom: 2px;
      }
      .osd-value { font-size: 20px; font-weight: 600; }
      .osd-sub { font-size: 13px; color: var(--slate); margin-top: 1px; margin-bottom: 8px; }
      .osd-gate { font-size: 15px; color: var(--amber); margin-top: 6px; letter-spacing: 0.08em; text-transform: uppercase; }
      .osd-best { font-size: 14px; color: var(--slate); margin-top: 3px; }
      .osd-corner {
        position: absolute; bottom: 20px; width: 190px;
        text-shadow: 0 2px 6px rgba(0,0,0,0.85); font-size: 15px;
      }
      .osd-left { left: 22px; }
      .osd-right { right: 22px; text-align: right; }
      .bar {
        height: 5px; margin-top: 7px; border-radius: 3px;
        background: rgba(12, 22, 34, 0.65);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.35);
        overflow: hidden;
      }
      .bar-fill { height: 100%; width: 0%; background: var(--mint); transition: width 0.12s linear; }
      .bar-fill.warm { background: var(--amber); }

      .banner.panel {
        background: rgba(9, 15, 23, 0.9); border-radius: 10px;
        padding: 20px 30px; box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.3);
        font-size: 24px; color: var(--cream); line-height: 1.45;
      }
      .banner {
        /* 22 percent, not 38. A regulation gate's aperture centre sits at
           0.762 m and the FPV camera is tilted up, so the target lands low in
           the frame, and a pilot found the launch banner drawn directly over
           the one thing they need to find. */
        position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%);
        text-align: center; white-space: pre-line; font-size: 30px; font-weight: 600;
        letter-spacing: 0.04em; color: var(--amber); opacity: 0;
        transition: opacity 0.18s ease; text-shadow: 0 3px 10px rgba(0,0,0,0.9);
      }

      .readout {
        position: absolute; right: 16px; top: 14px; display: none;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--slate); white-space: pre; text-align: right;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      }

      /* Screens. */
      .screen {
        position: absolute; inset: 0; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 4vh 6vw; box-sizing: border-box;
        /* Enough scrim to read type over a bright valley, not enough to
           turn a warm afternoon into night. */
        background:
          radial-gradient(120% 90% at 50% 42%, rgba(14, 23, 34, 0.58), rgba(9, 15, 23, 0.76));
      }
      /* The title keeps the world readable behind it; the reading screens
         sit on a heavier scrim because they are text. */
      .screen-title {
        background: linear-gradient(
          to bottom,
          rgba(8, 13, 20, 0.06) 0%,
          rgba(8, 13, 20, 0.20) 32%,
          rgba(10, 16, 24, 0.46) 62%,
          rgba(10, 16, 24, 0.60) 100%
        );
      }
      .screen-page { justify-content: center; }
      .screen h1 {
        margin: 0; font-size: clamp(44px, 8vw, 104px); font-weight: 800;
        letter-spacing: 0.14em; padding-left: 0.14em; color: var(--cream);
        text-shadow: 0 6px 26px rgba(0, 0, 0, 0.75);
      }
      .screen h2 {
        margin: 0 0 18px; font-size: clamp(24px, 3.4vw, 40px); font-weight: 700;
        letter-spacing: 0.06em; color: var(--cream);
      }
      .screen h3 {
        margin: 0 0 10px; font-size: 15px; font-weight: 700; color: var(--amber);
        letter-spacing: 0.12em; text-transform: uppercase;
      }
      .brand { text-align: center; margin-bottom: 34px; }
      .brand-sub {
        margin-top: 10px; font-size: clamp(14px, 1.5vw, 19px); color: var(--slate);
        letter-spacing: 0.22em; text-transform: uppercase;
      }
      .brand-best {
        display: inline-block; margin-top: 18px; padding: 5px 14px; border-radius: 999px;
        font-size: 14px; color: var(--mint); letter-spacing: 0.08em;
        background: rgba(9, 15, 23, 0.55); box-shadow: inset 0 0 0 1px rgba(125, 255, 180, 0.22);
      }
      .keep-note {
        max-width: 34em; margin: 16px auto 0; color: #90a6bb;
        font-size: 13px; line-height: 1.55; letter-spacing: 0.02em;
      }

      /* The menu is a fixed-width centre column. Help text lives in the
         right column so a long note cannot grow the list and shove the
         whole screen around. 1fr / auto / 1fr keeps the rows centred. */
      .menu-stage {
        display: grid;
        grid-template-columns: minmax(360px, 1.7fr) auto minmax(0, 0.65fr);
        width: min(1600px, 98vw);
        align-items: start;
        margin-top: 22px;
        pointer-events: none;
      }
      .screen-title .menu-stage { margin-top: 0; }
      .menu {
        min-width: min(540px, 82vw);
        margin-top: 16px;
        pointer-events: auto;
        padding: 6px 0 8px;
        border-radius: 10px;
        background: rgba(8, 13, 20, 0.42);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.16);
      }
      .menu-stage .menu { grid-column: 2; margin-top: 0; }
      .menu-scroll {
        max-height: min(58vh, 34em);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 212, 92, 0.45) rgba(12, 22, 34, 0.55);
      }
      .menu-help {
        grid-column: 3;
        padding: 12px 12px 8px 22px;
        margin-top: 8px;
        max-width: 26em;
        color: #90a6bb;
        font-size: 14px;
        line-height: 1.55;
        overflow-wrap: break-word;
        border-left: 1px solid rgba(157, 179, 200, 0.2);
      }
      .menu-help:empty { border-left-color: transparent; padding: 0; }
      .craft-showcase {
        grid-column: 1;
        justify-self: end;
        align-self: center;
        width: min(100%, 760px);
        margin-right: 12px;
        pointer-events: auto;
        overflow: hidden;
        border-radius: 16px;
        background: #121c28;
        box-shadow: 0 18px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(157, 179, 200, 0.16);
      }
      .craft-showcase-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #121c28;
      }
      .craft-view {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #121c28;
        touch-action: none;
      }
      .craft-showcase-cap {
        margin-top: 4px;
        padding: 0 10px 12px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: #7f95ab;
      }
      .menu-help-below {
        display: block;
        min-height: 3.4em;
        max-width: 40em;
        margin: 6px auto 4px;
        padding: 0 14px;
        text-align: center;
        border-left: none;
        box-sizing: border-box;
      }
      .row {
        display: flex; justify-content: space-between; align-items: center; gap: 20px;
        padding: 8px 16px; border-left: 3px solid transparent; color: var(--slate);
        font-size: clamp(16px, 1.9vw, 21px); cursor: pointer;
      }
      /* The cursor is a bar and a colour, not a slab: a wide amber block
         behind a three letter label reads as an unfinished progress bar. */
      .row.on {
        color: var(--cream); border-left-color: var(--amber);
        background: linear-gradient(90deg, rgba(255, 212, 92, 0.13), rgba(255, 212, 92, 0) 42%);
      }
      .row:hover .row-label { color: var(--cream); }
      .row-label { min-width: 0; }
      .row-value { color: var(--amber); font-size: 0.86em; }
      .row-control {
        display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
      }
      .step-col {
        display: inline-flex; flex-direction: column; gap: 2px;
      }
      .step {
        width: 1.35em; height: 1.05em; padding: 0; border: 0; border-radius: 3px;
        background: rgba(255, 212, 92, 0.14); color: var(--amber); cursor: pointer;
        font-size: 9px; line-height: 1; display: grid; place-items: center;
      }
      .step:hover { background: rgba(255, 212, 92, 0.32); }
      .drop-btn {
        appearance: none; border: 0; background: transparent;
        color: var(--amber); font: inherit; font-size: 0.86em;
        cursor: pointer; padding: 2px 2px 2px 8px;
        display: inline-flex; align-items: center; gap: 8px;
        max-width: 22em; text-align: right; line-height: 1.25;
      }
      .drop-btn::after {
        content: ""; width: 0; height: 0; flex: 0 0 auto;
        border-left: 4px solid transparent; border-right: 4px solid transparent;
        border-top: 5px solid var(--amber); opacity: 0.85;
      }
      .drop-list {
        position: fixed; z-index: 20; pointer-events: auto;
        max-height: min(280px, 46vh); overflow-y: auto;
        padding: 6px 0; border-radius: 8px;
        background: rgba(9, 15, 23, 0.97);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.28), 0 14px 32px rgba(0, 0, 0, 0.55);
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 212, 92, 0.45) rgba(12, 22, 34, 0.55);
      }
      .drop-opt {
        display: block; width: 100%; box-sizing: border-box;
        border: 0; background: transparent; color: var(--slate);
        font: inherit; font-size: 15px; text-align: left;
        padding: 7px 16px; cursor: pointer;
      }
      .drop-opt:hover, .drop-opt.on { color: var(--cream); background: rgba(255, 212, 92, 0.12); }
      .hint {
        margin-top: 22px; min-height: 1.4em; max-width: 42em;
        font-size: 13px; color: #7f95ab; letter-spacing: 0.05em; text-align: center;
      }
      @media (max-width: 860px) {
        .menu-stage {
          display: flex; flex-direction: column; align-items: stretch;
          width: min(540px, 90vw);
        }
        .menu { min-width: 0; width: 100%; }
        .menu-help {
          min-height: 4.8em; max-width: none; margin-top: 10px;
          padding: 8px 16px 0; border-left: none;
        }
        .menu-help:empty { min-height: 4.8em; padding: 8px 16px 0; }
        .craft-showcase {
          width: min(420px, 88vw);
          align-self: center;
          justify-self: center;
          margin: 0 auto 6px;
        }
      }

      /* The map screen. One card per world, each playing a short flight
         through it. The cursor is the same bar and colour the menu rows
         use, turned on its side: an amber edge and a lift, never a slab. */
      .map-cards {
        display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
        margin: 4px 0 10px; pointer-events: auto;
      }
      .map-card {
        width: min(300px, 78vw); cursor: pointer; border-radius: 8px;
        overflow: hidden; position: relative;
        background: rgba(9, 15, 23, 0.62);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.18);
        transition: transform 0.14s ease, box-shadow 0.14s ease;
      }
      .map-card.on {
        transform: translateY(-4px);
        box-shadow: inset 0 0 0 2px var(--amber), 0 10px 26px rgba(0, 0, 0, 0.45);
      }
      /* 16 by 9, so the thumbnail is the shape of the thing it is a
         thumbnail of. The canvas is sized in device pixels by the reel. */
      .map-reel { display: block; width: 100%; aspect-ratio: 16 / 9; background: #16222f; }
      .map-card-still {
        position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 16 / 9;
        display: flex; align-items: center; justify-content: center;
        padding: 0 18px; box-sizing: border-box; text-align: center;
        color: var(--slate); font-size: 13px; line-height: 1.5;
      }
      .map-card-still:empty { display: none; }
      .map-card-body {
        display: flex; align-items: baseline; gap: 10px;
        padding: 9px 13px 11px;
      }
      .map-card-name { color: var(--cream); font-size: 17px; font-weight: 600; }
      .map-card.on .map-card-name { color: var(--amber); }
      .map-card-tag {
        margin-left: auto; color: var(--mint); font-size: 11px;
        letter-spacing: 0.1em; text-transform: uppercase;
      }

      .cols { display: flex; gap: 6vw; flex-wrap: wrap; justify-content: center; }
      .col { max-width: 30em; }
      .col dl { margin: 0; }
      .col dt { color: var(--cream); font-size: 15px; font-weight: 600; margin-top: 12px; }
      .col dd { margin: 2px 0 0; color: var(--slate); font-size: 14px; line-height: 1.5; }
      .lede {
        max-width: 58em; margin: 24px auto 0; color: var(--slate);
        font-size: 15px; line-height: 1.65; text-align: center;
      }

      .screen-modal { background: rgba(8, 13, 20, 0.72); }

      .results { min-width: min(420px, 80vw); margin-bottom: 22px; }
      .result-row {
        display: flex; align-items: baseline; gap: 16px; padding: 7px 0;
        border-bottom: 1px solid rgba(157, 179, 200, 0.18); font-size: 20px;
      }
      .result-label { color: var(--slate); min-width: 5em; }
      .result-time { color: var(--cream); font-weight: 600; margin-left: auto; }
      .result-tag { color: var(--mint); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
      .result-row.void .result-time { color: #93a7ba; font-weight: 400; }
      .result-why { color: #7f95ab; font-size: 12px; letter-spacing: 0.06em; }
      .result-row.total { border-bottom: none; margin-top: 6px; }
      .result-row.total .result-time { color: var(--amber); }

      /* Loading. This markup is STATIC, and that is the point: it paints on
         the first layout, before the import map has resolved a single module,
         so the three.js fetch is a stage the player can see rather than a
         blank page. src/ui/loading.js only ever writes into it. */
      #loading {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: radial-gradient(120% 90% at 50% 42%, #16222f, #0a1119);
        font-family: var(--ui-font); color: var(--cream);
        font-variant-numeric: tabular-nums;
        transition: opacity 0.3s ease;
      }
      #loading[hidden] { display: none; }
      .loading-brand {
        font-size: clamp(30px, 6vw, 68px); font-weight: 800;
        letter-spacing: 0.14em; padding-left: 0.14em; margin-bottom: 34px;
      }
      .loading-track {
        width: min(420px, 68vw); height: 5px; border-radius: 3px;
        background: rgba(12, 22, 34, 0.8);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.35);
        overflow: hidden;
      }
      .loading-fill {
        height: 100%; width: 0%; background: var(--amber);
        transition: width 0.15s linear;
      }
      .loading-stage {
        margin-top: 16px; font-size: 13px; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--cream);
      }
      .loading-detail {
        margin-top: 6px; font-size: 12px; color: var(--slate);
        font-variant-numeric: tabular-nums; min-height: 1.2em;
      }

      .name-dialog {
        position: absolute; inset: 0; z-index: 8;
        display: flex; align-items: center; justify-content: center;
        background: rgba(8, 13, 20, 0.72);
        pointer-events: auto;
      }
      .name-dialog[hidden] { display: none; }
      .name-dialog-box {
        width: min(420px, 86vw); padding: 22px 24px 20px;
        background: #142230; border-radius: 10px;
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.35), 0 18px 40px rgba(0, 0, 0, 0.55);
      }
      .name-dialog-box h2 {
        margin: 0 0 10px; font-size: 22px; color: var(--cream);
      }
      .name-dialog-box .lede {
        margin: 0 0 10px; text-align: left; max-width: none; font-size: 14px;
      }
      .name-dialog-input {
        display: block; width: 100%; box-sizing: border-box;
        margin: 12px 0 8px; padding: 9px 11px;
        background: #0d151e; border: 1px solid rgba(157, 179, 200, 0.28);
        border-radius: 6px; color: var(--cream); font: inherit; font-size: 16px;
      }
      .name-dialog-input:focus {
        outline: none; border-color: var(--amber);
      }
      .name-dialog-err {
        min-height: 1.3em; margin: 0 0 10px; color: #ff8f8f; font-size: 12px;
      }
      .name-dialog-row { display: flex; gap: 8px; }
      .name-dialog-btn {
        appearance: none; border: 1px solid rgba(157, 179, 200, 0.28);
        background: #0d151e; color: var(--slate); font: inherit;
        padding: 7px 14px; border-radius: 6px; cursor: pointer;
      }
      .name-dialog-btn.on {
        background: var(--mint); border-color: var(--mint);
        color: var(--deep); font-weight: 600;
      }
    </style>
    <!-- Three.js only, pinned. The addons path is the same package, used
         for the post processing chain; nothing else is on the render
         side. See PROGRESS.md. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="loading-brand">WEBFPV</div>
      <div class="loading-track"><div class="loading-fill"></div></div>
      <div class="loading-stage">Starting</div>
      <div class="loading-detail"></div>
    </div>
    <!-- boot.js, not main.js. It imports nothing at module scope except the
         loading screen, so the screen is alive and reporting BEFORE the
         three.js fetch begins. main.js imports three statically and is itself
         one of boot's stages. -->
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
