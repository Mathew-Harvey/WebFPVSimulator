<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebFPV, orbit</title>
    <link rel="icon" href="data:," />
    <style>
      html, body {
        margin: 0; width: 100%; height: 100%; overflow: hidden;
        background: #141c16;
      }
      #view, .orbit-clip {
        display: block; position: fixed; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover; background: #141c16;
      }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center;
        padding: 12px; box-sizing: border-box; text-align: center;
        color: #8a9a86; font: 13px/1.45 system-ui, sans-serif;
        pointer-events: none;
      }
      #status.gone { display: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="status">Loading the world.</div>
    <script type="module" src="./orbit.js"></script>
  </body>
</html>
